name: Platform checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['platform/**', 'collections/**/content.demo.json', 'docs/03_URUN_ICERIK_SEMASI.json', 'tools/validate_content.py', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', 'collections/**/content.demo.json', 'docs/03_URUN_ICERIK_SEMASI.json', 'tools/validate_content.py', '.github/workflows/platform-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platform
    env:
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # The runner's disk fills up (checkout of the repo's images + npm cache + Chromium + build): remove preinstalled
      # SDKs this job never uses (~20 GB) before anything else.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.25.1'
      - run: npm ci
      # Production dependencies only: a high or critical advisory fails the job; moderate ones are listed, not fatal.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for PDF tests
        run: npx --no-install playwright-core install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Verify generated marketing pages
        run: node --test --test-reporter=spec tests/marketing-build.test.ts
