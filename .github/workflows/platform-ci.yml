name: Platform checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['platform/**', 'collections/**/content.demo.json', 'docs/03_URUN_ICERIK_SEMASI.json', 'tools/validate_content.py', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', 'collections/**/content.demo.json', 'docs/03_URUN_ICERIK_SEMASI.json', 'tools/validate_content.py', '.github/workflows/platform-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platform
    env:
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.25.1'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Verify generated marketing pages
        run: node --test --test-reporter=spec tests/marketing-build.test.ts
