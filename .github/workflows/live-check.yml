# Hourly read-only check of the live site (G966): platform/scripts/live-ping.mjs opens /, /start, one demo site and the
# legal pages of https://bkestudio.com and checks status codes, TLS and response time. It creates no data and needs no
# secrets (no Blob token, no admin password). On a failure it opens — or reopens and updates — ONE issue titled
# "Canlı kontrol başarısız" (label canli-kontrol) with the log; when the check passes again it comments and closes it.
# /terms and /kvkk may answer 404 until those pages are deployed: drop them from --allow-404 below once they are live.
# Scheduled runs use the default branch's copy of this file.
name: Live check
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: https://bkestudio.com
      ISSUE_TITLE: Canlı kontrol başarısız
      ISSUE_LABEL: canli-kontrol
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            platform/scripts/live-ping.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ping the live site
        id: ping
        run: |
          set -o pipefail
          node platform/scripts/live-ping.mjs --base "$LIVE_BASE_URL" --allow-404 /terms,/kvkk 2>&1 | tee live-ping.log
      - name: Open or update the issue
        if: failure() && steps.ping.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE;
            const log = fs.existsSync('live-ping.log') ? fs.readFileSync('live-ping.log', 'utf8').slice(-60000) : '(no log)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Son başarısız kontrol: ${new Date().toISOString()} — [çalışma](${run})`,
              '',
              '```text',
              log.trim(),
              '```',
              '',
              'Okuma: FAIL satırları sorunlu adresi ve nedeni söyler (HTTP kodu, zaman aşımı, TLS, yer tutucu).',
              'Kontrol yeniden geçince bu kayıt kendiliğinden kapanır. Betik: platform/scripts/live-ping.mjs.',
            ].join('\n');
            const label = process.env.ISSUE_LABEL;
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205', description: 'live-check.yml: bkestudio.com kontrolü' });
            }
            const found = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', labels: label, sort: 'created', direction: 'desc', per_page: 100,
            });
            const issue = found.find((i) => i.title === title && !i.pull_request);
            if (!issue) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            } else if (issue.state === 'closed') {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'open', body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Yeniden başarısız: ${run}` });
            } else {
              // Already open: refresh the body with the newest log (no new notification every hour).
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            }
      - name: Close the issue after a pass
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            let open = [];
            try {
              open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: process.env.ISSUE_LABEL, per_page: 100 });
            } catch (e) {
              if (e.status !== 404) throw e; // the label does not exist yet: nothing was ever opened
            }
            const issue = open.find((i) => i.title === title && !i.pull_request);
            if (issue) {
              const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Kontrol yeniden geçti: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
