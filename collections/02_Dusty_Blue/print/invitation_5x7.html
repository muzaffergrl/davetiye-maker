<title>Dusty Blue 5x7 Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@500&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #2B3A4E; --deep: #4E6782; --gold: #B8996A; --gold-light: #D9C49E; --ivory: #FBF7EF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E4E9EE; }
  body { padding: 0; }
  .page { position: relative; width: 1500px; height: 2100px; overflow: hidden; background: var(--ivory);
          font-family: 'Cormorant Garamond', Georgia, serif; color: var(--ink); }
  .abs { position: absolute; }
  .t { position: absolute; left: 0; width: 1500px; text-align: center; }
  .caps { font-family: 'Montserrat', sans-serif; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: var(--deep); }
  .script { font-family: 'Pinyon Script', cursive; font-weight: 400; color: var(--ink); line-height: 1.1; }
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-variant-numeric: lining-nums; }
  .it { font-style: italic; }
  .line { position: absolute; height: 0; border-top: 2px solid var(--gold); }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
