<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=block">
<style>
:root{--ink:#2F3A2B;--deep:#5E6B45;--paper:#F7F4EA;--ivory:#FBF8F0;--gold:#B39A63}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2000px;height:2500px;overflow:hidden;background:var(--paper)}
body{position:relative;font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:url("BG") center 38%/cover}
.veil{position:absolute;left:-200px;right:-200px;top:-260px;height:1300px;background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(247,244,234,.97) 0%, rgba(247,244,234,.93) 55%, rgba(247,244,234,0) 100%)}
.vb{position:absolute;left:-100px;right:-100px;bottom:-160px;height:420px;background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(247,244,234,.96) 0%, rgba(247,244,234,.85) 55%, rgba(247,244,234,0) 100%)}
.c{position:absolute;left:0;right:0;text-align:center}
.kicker{font-family:Montserrat,Arial,sans-serif;font-weight:600;font-size:38px;letter-spacing:.34em;text-transform:uppercase;color:var(--deep)}
.t1{font-weight:700;font-size:176px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.t2{display:flex;align-items:baseline;justify-content:center;gap:34px;margin-top:6px}
.t2 .w{font-family:"Great Vibes",cursive;font-size:150px;line-height:1;color:var(--deep)}
.t2 .r{font-weight:700;font-size:200px;line-height:1;letter-spacing:.06em;color:var(--deep)}
.phone{position:absolute;width:770px;height:1640px;border-radius:118px;background:#161616;padding:24px;
 box-shadow:0 0 0 5px #3a3a3a inset,0 0 0 3px #c9c3b5,0 50px 90px rgba(40,45,30,.38),0 18px 30px rgba(40,45,30,.22)}
.phone .scr{width:100%;height:100%;border-radius:96px;overflow:hidden;background:var(--scrtop,#F4F1E6);padding-top:80px}
.phone .scr img{width:100%;height:100%;object-fit:cover;display:block}
.phone .isl{position:absolute;left:50%;top:50px;width:190px;height:54px;margin-left:-95px;border-radius:27px;background:#0d0d0d}
.badge{position:absolute;width:330px;height:330px;border-radius:50%;background:var(--deep);color:var(--ivory);display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:46px;line-height:1.05;letter-spacing:.04em;
 box-shadow:0 20px 44px rgba(40,45,30,.33);border:6px solid var(--ivory);outline:3px solid var(--deep)}
.badge small{display:block;font-weight:600;font-size:27px;letter-spacing:.12em;margin-top:10px;opacity:.92}
.foot{font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:40px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.foot span{color:var(--deep)}
</style></head><body>
<div class="bg"></div><div class="veil"></div>
<div class="c" style="top:150px"><div class="kicker">Olive &amp; Ivory &nbsp;·&nbsp; Digital Invitation</div></div>
<div class="c" style="top:245px"><div class="t1">Wedding Website</div><div class="t2"><span class="w">with</span><span class="r">RSVP</span></div></div>
<div class="phone" style="left:205px;top:760px;transform:rotate(-4deg)"><div class="scr"><img src="SCR1"></div><div class="isl"></div></div>
<div class="phone" style="left:1025px;top:700px;transform:rotate(4deg)"><div class="scr"><img src="SCR2"></div><div class="isl"></div></div>
<div class="badge" style="left:95px;top:1690px;transform:rotate(-8deg)">NO<br>CANVA<small>NEEDED</small></div>
<div class="badge" style="left:1590px;top:650px;transform:rotate(8deg)">RSVP<small>GUEST LIST<br>INCLUDED</small></div>
<div class="badge" style="left:1585px;top:1870px;transform:rotate(6deg)">EDIT<small>ON YOUR<br>PHONE</small></div>
<div class="vb"></div><div class="c" style="top:2410px"><div class="foot">Try the live demo &nbsp;<span>·</span>&nbsp; Instant access</div></div>
</body></html>
