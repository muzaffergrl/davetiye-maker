<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview thumbs</title>
<style>{{fonts_css}}</style>
<style>
  /* Küçük resim denetimi: her görsel 300 px (kare) ve 4:3 orta kırpımı (Etsy arama ızgarası gibi), 1:1 piksel. */
  html, body { margin: 0; background: #EDE5D7; }
  body { width: {{w}}px; height: {{h}}px; font-family: 'DM Sans', sans-serif; color: #2B1526; }
  .wrap { padding: 36px 40px; }
  h1 { margin: 0 0 6px; font: 600 30px 'DM Sans'; }
  p { margin: 0 0 26px; font: 400 18px 'DM Sans'; }
  .row { display: flex; align-items: flex-start; gap: 28px; margin-bottom: 26px; }
  .row .name { width: 170px; font: 500 20px 'DM Sans'; padding-top: 6px; }
  figure { margin: 0; }
  figure img { display: block; box-shadow: 0 2px 10px rgba(43, 21, 38, 0.15); }
  figcaption { font: 400 15px 'DM Sans'; margin-top: 8px; color: #5b4656; }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{title}}</h1>
  <p>Each image at 300 px and its 4:3 centre crop (2000 × 1500 → 300 × 225), shown at 1:1 pixels.</p>
  {{rows}}
</div>
<script>
  Promise.all(['400 18px "DM Sans"', '500 20px "DM Sans"', '600 30px "DM Sans"'].map((f) => document.fonts.load(f)))
    .then(() => document.fonts.ready).then(() => { window.__hazir = true; });
</script>
</body>
</html>
