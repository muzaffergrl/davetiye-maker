<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LC7 live demo</title>
<style>{{fonts_css}}</style>
<style>{{base_css}}</style>
<style>
  /* GM03 lc7_demo: başlık + not hapı + telefon. Masa üstü sahnesinde (flatlay) sol üçte bir yazıya ayrılmış:
     başlık ve not solda, dikeyde telefonun ortasına hizalı; logo sol altta. QR ve web adresi YOK. */
  .col { position: absolute; left: {{col_left}}px; top: {{col_top}}px; width: {{col_w}}px; transform: translateY(-50%); }
  .col .h1 { position: static; text-align: left; font-size: 188px; line-height: 0.96; }
  .note {
    margin-top: 64px; display: inline-block; padding: 34px 48px; border-radius: 52px;
    background: rgba(250, 247, 240, 0.94);
    box-shadow: 0 14px 36px rgba(43, 21, 38, 0.13), 0 2px 6px rgba(43, 21, 38, 0.06);
    font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 54px; line-height: 1.24; letter-spacing: -0.005em;
    color: var(--anchor);
  }
  .logo { left: {{col_left}}px; bottom: 96px; }
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="{{bg}}" alt="">
  <div class="col" data-kutu="sutun">
    <div class="h1" data-kutu="baslik" data-fit="{{col_w}}">Try the<br>live demo</div>
    <div class="note" data-kutu="not">Open the demo link<br>in the description</div>
  </div>
  <div class="logo chip" data-kutu="logo">{{logo}}</div>
</div>
<script>{{fit_js}}</script>
</body>
</html>
