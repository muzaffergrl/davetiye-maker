{{head}}
<style>
  :root { --pw: 560px; --gap: 60px; --corner: 400px; }
  .row { top: 440px; }
  .cap { width: 600px; }
  /* the step number sits in the caption, never over the screen (an earlier badge covered screen text) */
  .cap h2 .k { display: inline-grid; place-items: center; width: 74px; height: 74px; margin-right: 14px; vertical-align: 6px;
    border-radius: 50%; border: 3px solid var(--gold); background: var(--ivory); font-size: 48px; line-height: 1; }
</style>
</head>
<body>
<img class="corner tl" src="{{part.corner_tl}}" alt="">
<header class="head">
  <p class="eyebrow">{{theme_name}}</p>
  <h1 class="serif">How it works</h1>
  <p class="sub">From your Etsy order to your guests' phones</p>
</header>
<div class="row">
  <div class="col"><div class="slot"><img class="phone" src="{{shot.b01_start}}" alt=""></div><div class="cap"><h2><span class="k">1</span>Start</h2><p>Open the link in your PDF, enter your order number</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.b04_panel_top}}" alt=""></div><div class="cap"><h2><span class="k">2</span>Personalize</h2><p>Your names, date, venue and photos</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.b10_live_qr}}" alt=""></div><div class="cap"><h2><span class="k">3</span>Publish &amp; share</h2><p>Send your link or print the QR code</p></div></div>
</div>
</body>
</html>
