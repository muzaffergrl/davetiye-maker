{{head}}
<style>
  /* 1080 × 1080 backdrop of the listing video: text left, the recording is laid over the box on the right by ffmpeg */
  :root { --w: 1080px; --h: 1080px; --corner: 300px; }
  .slot { position: absolute; left: {{slot_x}}px; top: {{slot_y}}px; width: {{slot_w}}px; height: {{slot_h}}px; border-radius: {{slot_r}}px;
    background: var(--ivory); box-shadow: 0 18px 44px rgba(40, 30, 20, .25), 0 3px 10px rgba(40, 30, 20, .12); z-index: 1; }
  .txt { position: absolute; left: 70px; top: 300px; width: 400px; z-index: 2; }
  .txt .eyebrow { font-size: 26px; letter-spacing: .2em; }
  .txt h1 { font-size: 92px; line-height: 1.05; color: var(--deep); margin: 14px 0 22px; }
  .txt p { font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px; line-height: 1.3; color: var(--ink); }
  .txt p + p { margin-top: 14px; }
  /* ≥ 26 px: Etsy shows the 1080 px clip about 390 px wide on a phone */
  .txt .small { font-family: "Montserrat", Arial, sans-serif; font-size: 27px; line-height: 1.3; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); margin-top: 34px; font-weight: 600; }
  .corner.tl { width: 280px; }
  .corner.br { width: 240px; }
</style>
</head>
<body>
<img class="corner tl" src="{{part.corner_tl}}" alt="">
<img class="corner br" src="{{part.corner_br}}" alt="">
<div class="txt">
  <p class="eyebrow">Wedding website</p>
  <h1 class="script">{{theme_name}}</h1>
  <p>Guests tap the {{opening}} and it opens.</p>
  <p>Home, Our Story, Details and RSVP follow.</p>
  <p class="small">Sample names and photos</p>
</div>
<div class="slot"></div>
</body>
</html>
