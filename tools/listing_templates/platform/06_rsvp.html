{{head}}

  :root { --pw: 560px; --gap: 60px; --corner: 400px; }
  .row { top: 440px; }
  .cap { width: 600px; }
</style>
</head>
<body>
<img class="corner tl" src="{{part.corner_tl}}" alt="">

</header>
<div class="row">
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g10_rsvp_form}}" alt=""></div><div class="cap"><h2>Guests reply</h2><p>On your website, with your own question</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.p01_panel_replies}}" alt=""></div><div class="cap"><h2>You see every reply</h2><p>With the head count and a CSV download</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.p03_panel_questions}}" alt=""></div><div class="cap"><h2>Ask up to 3 questions</h2><p>Meal choice or anything you like</p></div></div>
</div>
</body>
</html>
