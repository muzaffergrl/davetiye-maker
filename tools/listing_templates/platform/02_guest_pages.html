{{head}}
<style>
  /* The design's own GPT scene (three_phones.png) with three real guest pages in the phones (listing_kit.scene_background). */
  body { background: #e9e4da url('{{scene.bg}}') center / 2000px 2000px no-repeat; }
  .head { top: 96px; padding: 0 140px; }
  .plate { display: inline-block; padding: 24px 64px 30px; border-radius: 44px;
    background: color-mix(in srgb, var(--ivory) 80%, transparent); backdrop-filter: blur(6px);
    box-shadow: 0 18px 50px rgba(40, 30, 20, .14); }
  .eyebrow { font-size: 32px; }
  .head h1 { font-size: 112px; margin: 12px 0 8px; white-space: nowrap; }
  .sub { font-size: 48px; white-space: nowrap; }
  .pill { position: absolute; top: {{below_screens}}px; transform: translateX(-50%); z-index: 2;
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 60px; line-height: 1; color: var(--deep);
    padding: 16px 40px 20px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, var(--ivory) 92%, transparent); border: 2px solid var(--gold-light);
    box-shadow: 0 10px 26px rgba(40, 30, 20, .12); }
</style>
</head>
<body>
<header class="head">
  <div class="plate">
    <p class="eyebrow">{{theme_name}} · For your guests</p>
    <h1 class="serif">Every page your guests need</h1>
    <p class="sub">Envelope · Home · Our Story · Details · RSVP</p>
  </div>
</header>
<span class="pill" style="left: {{s1_cx}}px">Home</span>
<span class="pill" style="left: {{s2_cx}}px">Our Story</span>
<span class="pill" style="left: {{s3_cx}}px">RSVP</span>
</body>
</html>
