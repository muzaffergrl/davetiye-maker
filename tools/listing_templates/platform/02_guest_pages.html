{{head}}
<style>
  :root { --pw: 356px; --gap: 18px; --corner: 420px; }
  .row { top: 520px; }
  .cap { width: calc(var(--pw) + 14px); }
  .cap .n { font-size: 60px; }
  .cap h2 { font-size: 56px; }
  .note { top: 1690px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 46px; }
</style>
</head>
<body>
<img class="corner tl" src="{{part.corner_tl}}" alt="">
<img class="corner br" src="{{part.corner_br}}" alt="">
<header class="head">
  <p class="eyebrow">{{theme_name}} · For your guests</p>
  <h1 class="serif">Five pages, one invitation</h1>
  <p class="sub">{{tagline}}</p>
</header>
<div class="row">
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g01_envelope}}" alt=""></div><div class="cap"><div class="n">1</div><h2>Envelope</h2><p>Tap to open</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g04_home_calendar}}" alt=""></div><div class="cap"><div class="n">2</div><h2>Home</h2><p>Invitation, countdown</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g05_story}}" alt=""></div><div class="cap"><div class="n">3</div><h2>Our Story</h2><p>Your photos</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g06_details_top}}" alt=""></div><div class="cap"><div class="n">4</div><h2>Details</h2><p>Schedule, venue</p></div></div>
  <div class="col"><div class="slot"><img class="phone" src="{{shot.g09_rsvp_top}}" alt=""></div><div class="cap"><div class="n">5</div><h2>RSVP</h2><p>Guests reply online</p></div></div>
</div>
<p class="note">Guests need no app and no account: just the link</p>
</body>
</html>
