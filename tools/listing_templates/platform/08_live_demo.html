{{head}}
<style>
  :root { --corner: 440px; }
  .left { position: absolute; left: 200px; top: 540px; width: 900px; z-index: 1; }
  .qr { padding: 64px 70px 56px; text-align: center; }
  .qr img { width: 640px; height: 640px; display: block; margin: 0 auto; image-rendering: pixelated; }
  .qr .scan { font-weight: 600; font-size: 40px; letter-spacing: .1em; text-transform: uppercase; color: var(--deep); margin-top: 36px; white-space: nowrap; }
  .left .note { position: static; text-align: left; margin-top: 34px; padding-left: 8px; }
  .ph { position: absolute; right: 200px; top: 520px; --pw: 560px; z-index: 1; transform: rotate(2deg); }
</style>
</head>
<body>
<img class="corner tl" src="{{part.corner_tl}}" alt="">
<img class="corner br" src="{{part.corner_br}}" alt="">
<header class="head">
  <p class="eyebrow">{{theme_name}}</p>
  <h1 class="serif">Try the live demo</h1>
  <p class="sub">Open it on your phone before you buy</p>
</header>
<div class="left">
  <div class="qr card">
    <img src="{{qr.demo}}" alt="QR code of the demo">
    <p class="scan">Scan to open the live demo</p>
  </div>
  <p class="note">The demo shows sample names and placeholder photos.<br>You add your own after purchase.</p>
</div>
<img class="phone ph" src="{{shot.d01_demo_home}}" alt="">
</body>
</html>
