<!doctype html>
<!-- Boho Pampas Terracotta · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in brush script, "MOMENTS WE HOLD
     DEAR", three separate tall arch frames standing side by side with clear space between them (two nested gouache bands
     like a small boho rainbow, each with its own photo window and a pampas spray at its lower left), the middle one
     tallest and slightly in front, a script caption under each. Choreography: the arches open like a rainbow — each frame
     rises from its base outward (clip-path over the GPT frame), the middle one first, then its neighbours slide out from
     behind it, then the captions are written. On phones the side-by-side row would leave each photo window ~70 px wide
     (< 38vw, docs/11 §9): the three arches step down the page in a zigzag (left, right — the tallest — left), each window
     ≥ 38vw, the caption beside it; from 720 px wide the comp's row stands as drawn. Photo slots story_1..3 (theme.json →
     media.memory_photos.0..2), captions story.items.0..2.caption. The page is off (404) when optional_blocks.our_story is
     false. Kicker / title = design copy. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#ECCBA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,400;0,600;1,400;1,600&amp;family=Sacramento&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:91.3%;ascent-override:101.9%;descent-override:58.1%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:78.5%;ascent-override:118.5%;descent-override:67.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <img class="corner corner-tl page-corner" data-step="decor" data-a="drift-tl" src="img/decor_tl-480.webp" srcset="img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w, img/decor_tl-960.webp 960w" sizes="min(42vw, 300px)" alt="">
    <h1 class="script page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-copy="story_kicker">Moments we hold dear</p>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the three arches (one scene): the middle arch rises first like a rainbow, its neighbours slide out from behind it,
       then the captions. Phones: a zigzag down the page, the caption beside each arch -->
  <section class="arches" data-scene="story-arches" aria-label="Our photos">
    <figure class="arch a-1">
      <div class="frame" data-step="side" data-a="rainbow">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 720px) 128px, 40vw" alt="" data-attr-alt="{story.items.0.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_3-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) 200px, 63vw" alt="" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-i="0" data-a="write" data-field="story.items.0.caption"></figcaption>
    </figure>
    <figure class="arch a-2">
      <div class="frame" data-step="mid" data-a="rainbow">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 720px) 152px, 44vw" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_3-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) 238px, 69vw" alt="" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-i="1" data-a="write" data-field="story.items.1.caption"></figcaption>
    </figure>
    <figure class="arch a-3">
      <div class="frame" data-step="side" data-a="rainbow">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 720px) 128px, 40vw" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_3-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) 200px, 63vw" alt="" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-i="2" data-a="write" data-field="story.items.2.caption"></figcaption>
    </figure>
  </section>

  <section class="section next-sec" data-scene="story-next">
    <img class="corner corner-br page-corner" data-step="decor" data-a="drift-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-720.webp 720w, img/decor_br-940.webp 940w" sizes="min(56vw, 320px)" alt="" loading="lazy">
    <img class="sprig" data-step="sprig" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="150px" alt="" loading="lazy">
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Details page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
