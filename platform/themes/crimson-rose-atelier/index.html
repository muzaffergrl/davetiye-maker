<!doctype html>
<!-- Crimson Rose Atelier · page 1 — envelope landing (/<slug>). Oxblood paper, a crimson rose branch at the top-right, the
     names in large Cormorant, the burgundy envelope with its gold botanical wax seal, "TAP TO OPEN". Opening (docs/11 §7.3,
     kapak): on tap the seal lifts and drops away, the flap (cut from the closed envelope) turns up on its hinge, the open
     envelope's lining shows, and the ivory card — the oval portrait, "Our wedding", the names, the date — rises out of the
     pocket, comes forward and flies to home (view transition invite-card → the home oval portrait). Seal, flap, pocket and
     card are separate layers that move on their own. Personal text: none — [data-field] / [data-text] / [data-photo] are
     filled on the server. Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its
     oval the thank-you photo or — without one — the rose branch. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#39090e">
<title data-text="{name_display} · {copy.envelope_kicker}">Crimson Rose Atelier</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:96.7%;ascent-override:95.2%;descent-override:30%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:83.1%;ascent-override:110.7%;descent-override:34.9%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<style>.js:not(.parts-on) img[data-defer]{display:none!important}</style>
<script>/* deferred opening parts (G180, docs/11 §6): the images that only show after the tap ([data-defer], lazy) wait until the
   closed object's own high-priority image(s) in .stage have loaded and painted, then all load at once — before the tap, so the opening never waits */
(function(d,r){var on=function(){r.classList.add('parts-on')};if(r.classList.contains('is-opened'))return on();addEventListener('pointerdown',on,true);addEventListener('keydown',on,true);addEventListener('load',on);d.addEventListener('DOMContentLoaded',function(){var h=d.querySelectorAll('.stage img[fetchpriority=high]');h=h.length?h:d.querySelectorAll('img[fetchpriority=high]');var n=h.length,one=function(){--n||requestAnimationFrame(function(){setTimeout(on)})};if(!n)on();h.forEach(function(i){i.complete?one():(i.addEventListener('load',one),i.addEventListener('error',one))})})})(document,document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span> <span aria-hidden="true">→</span></a>
<main class="opening">
  <div class="opening-flowers" aria-hidden="true"><img class="rose opening-rose" src="img/rose-branch.webp" alt=""></div>
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names"><span data-field="partners.0.display_name" class="first-name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name" class="second-name"></span></h1>
    <p class="eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <span class="env-back" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/envelope-open.webp" alt=""></span>
    <span class="env-card" aria-hidden="true">
      <span class="card-oval photo-slot" data-slot="hero_portrait">
        <img data-defer loading="lazy" fetchpriority="low" decoding="async" data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" alt="" sizes="min(23vw, 140px)">
        <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
        <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(23vw, 140px)" alt="">
        <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/rose-branch.webp" alt=""></span>
      </span>
      <span class="card-text">
        <span class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</span>
        <span class="card-names" data-if="!thank_you_on" data-field="name_display"></span>
        <span class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></span>
        <span class="eyebrow" data-field="date"></span>
      </span>
    </span>
    <span class="env-pocket" aria-hidden="true"><img src="img/envelope-closed.webp" alt="" fetchpriority="high"></span>
    <span class="env-flap" aria-hidden="true"><img src="img/envelope-closed.webp" alt=""></span>
    <span class="env-seal" aria-hidden="true"><img src="img/seal.webp" alt=""></span>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
