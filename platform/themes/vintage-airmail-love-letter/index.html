<!doctype html>
<!-- Vintage Airmail Love Letter · page 1 — envelope landing (/<slug>). W1.1 comp: "YOU ARE INVITED" typed, the names in
     fountain-pen script, the airmail envelope (red-and-navy striped edges, two botanical stamps) sealed with a small
     burgundy wax seal and a sprig of lavender on its perforated tear strip, "TAP TO OPEN". Opening (catalogue, docs/11 §7.2
     "kapak — yırtma şeridi"): on tap the little wax seal pops off, the perforated tear strip rips away along the top edge
     from left to right, and the cream letter card slides up out of the envelope while a pressed flower flutters down; the
     card comes forward and flies to home (view transition). Personal text: none — [data-field] / [data-text] /
     [data-photo] are filled on the server (platform/README.md). Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-attr-content="You're invited · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-attr-content="You're invited · {date|date-long} · {venue.city_region}" content="You're invited">
<meta name="theme-color" content="#E2CBAD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Homemade+Apple&amp;family=Special+Elite&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the parchment with faint map lines + the two GPT dried-flower clusters as separate layers, each wholly
     on screen (phones: the calm map-lined part of bg_page; landscape screens: the soft-focus page) -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/mist-640.webp">
    <img class="scene-img" src="img/bg_page-640.webp" srcset="img/bg_page-640.webp 640w, img/bg_page-1024.webp 1024w" sizes="212vw" alt="" fetchpriority="high">
  </picture>
  <img class="corner corner-tl" src="img/decor_tl-480.webp" srcset="img/decor_tl-480.webp 480w, img/decor_tl-760.webp 760w" sizes="(min-aspect-ratio: 3/4) min(32vw, 48vh, 500px), min(66vw, 32svh, 340px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-760.webp 760w" sizes="(min-aspect-ratio: 3/4) min(32vw, 48vh, 500px), min(62vw, 33svh, 330px)" alt="">
  <!-- the comp's loose accents on the paper (GPT accents: a faint postmark ring, a pressed forget-me-not) -->
  <img class="float f-mark" src="img/accent_3-240.webp" alt="">
  <img class="float f-flower" src="img/accent_2-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span>Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker">You are invited</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="env">
      <!-- the letter card waits behind the envelope body (clipped at its bottom edge) -->
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(26vw, 140px)" alt="">
            <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(37vw, 190px)" alt="">
          <div class="card-copy">
            <p class="script">We're getting married</p>
            <p class="type" data-field="date"></p>
            <p class="type" data-field="venue.city_region"></p>
          </div>
        </div>
      </div>
      <!-- envelope body (with the torn edge under the strip), the tear strip as it sits, the part that rips away -->
      <img class="env-open" src="img/env_open-440.webp" srcset="img/env_open-440.webp 440w, img/env_open-880.webp 880w" sizes="min(86vw, 440px)" alt="" fetchpriority="high">
      <img class="env-strip" src="img/env_strip-440.webp" srcset="img/env_strip-440.webp 440w, img/env_strip-880.webp 880w" sizes="min(86vw, 440px)" alt="">
      <img class="env-torn" src="img/env_torn-440.webp" srcset="img/env_torn-440.webp 440w, img/env_torn-880.webp 880w" sizes="min(86vw, 440px)" alt="">
      <!-- the wax seal + lavender (one GPT piece) on the tear strip; the monogram sits in its smooth centre -->
      <div class="closure">
        <img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(17vw, 84px)" alt="">
        <span class="seal-mono" data-field="initials"></span>
      </div>
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap">Tap to open</span><span class="click">Click to open</span></p>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter>Enter</a>
    <button class="replay textlink" type="button">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html">Open the invitation</a></p>
</main>

</body>
</html>
