<!doctype html>
<!-- Sunflower Rustic Barn · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the brush script, "MOMENTS WE
     HOLD DEAR" over a small spray, then a weathered barn-wood wall of vertical planks (GPT barnwood, turned 90°) with
     three gently sagging jute twine lines (GPT twine_line) and on each a vintage deckle-edged photo print pegged with a
     small wooden clothespin (GPT frame_portrait), a little sunflower or wheat ear beside it, the caption in the script.
     Opening of the page (catalogue: "İpe mandalla asılmış fotoğraflar, tek tek mandallanır"): each line stretches across
     (unfurl), then its print is pegged onto it — it drops onto the twine and swings to rest (preset "peg") — one by one as
     they scroll in, then the caption is written. Personal text: none — the intro, the date and the captions are filled
     on the server; 0–3 photos and empty captions keep the layout. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#F9E7CB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;family=Merriweather:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:97.9%;ascent-override:110.3%;descent-override:37.8%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:84.2%;ascent-override:128.2%;descent-override:43.9%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-aspect-ratio: 3/4)" srcset="img/field_wide-640.webp">
        <img class="scene-img" src="img/field-425.webp" alt="">
      </picture>
      <img class="corner corner-tl" data-step="decor" data-a="sway-tl" src="img/florals_tl-360.webp" srcset="img/florals_tl-360.webp 360w, img/florals_tl-540.webp 540w, img/florals_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 46vh, 400px), min(52vw, 300px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="sway-br" src="img/florals_br-360.webp" srcset="img/florals_br-360.webp 360w, img/florals_br-540.webp 540w, img/florals_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 48vh, 420px), min(50vw, 27svh, 300px)" alt="">
      <img class="float f-petal" data-step="decor" data-a="fade" src="img/accent_1-94.webp" alt="">
      <img class="float f-head" data-step="decor" data-a="fade" src="img/accent_2-200.webp" alt="">
      <img class="float f-wheat" data-step="decor" data-a="fade" src="img/accent_3-52.webp" alt="">
    </div>
    <h1 class="script page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <span class="orn" data-step="kicker" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the barn-wood wall: one scene per line — the twine stretches across, the print is pegged on it, the caption is written -->
  <section class="wall" aria-label="Our photos">
    <figure class="line-row lr-1 lr-r" data-scene="story-line" data-fold>
      <img class="twine" data-step="line" data-a="unfurl" src="img/twine_line-480.webp" srcset="img/twine_line-480.webp 480w, img/twine_line-960.webp 960w" sizes="min(100vw, 900px)" alt="">
      <div class="print pr-portrait" data-step="print" data-a="peg">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 720px) min(24vw, 250px), min(51vw, 250px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(30vw, 312px), min(64vw, 312px)" alt="">
        <img class="tuck t-head" src="img/accent_2-200.webp" alt="" aria-hidden="true">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
    </figure>
    <figure class="line-row lr-2 lr-l" data-scene="story-line" data-fold>
      <img class="twine" data-step="line" data-a="unfurl" src="img/twine_line-480.webp" srcset="img/twine_line-480.webp 480w, img/twine_line-960.webp 960w" sizes="min(100vw, 900px)" alt="" loading="lazy">
      <div class="print pr-portrait" data-step="print" data-a="peg">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 720px) min(24vw, 250px), min(51vw, 250px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(30vw, 312px), min(64vw, 312px)" alt="" loading="lazy">
        <img class="tuck t-wheat" src="img/accent_3-52.webp" alt="" aria-hidden="true" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
    </figure>
    <figure class="line-row lr-3 lr-c" data-scene="story-line" data-fold>
      <img class="twine" data-step="line" data-a="unfurl" src="img/twine_line-480.webp" srcset="img/twine_line-480.webp 480w, img/twine_line-960.webp 960w" sizes="min(100vw, 900px)" alt="" loading="lazy">
      <div class="print pr-portrait" data-step="print" data-a="peg">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 720px) min(24vw, 250px), min(51vw, 250px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(30vw, 312px), min(64vw, 312px)" alt="" loading="lazy">
        <img class="tuck t-head" src="img/accent_2-200.webp" alt="" aria-hidden="true" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
    </figure>
  </section>

  <section class="section next-sec wood-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="sway-br" src="img/florals_br-360.webp" srcset="img/florals_br-360.webp 360w, img/florals_br-540.webp 540w, img/florals_br-720.webp 720w" sizes="min(54vw, 320px)" alt="" loading="lazy">
    <span class="orn" data-step="orn" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
