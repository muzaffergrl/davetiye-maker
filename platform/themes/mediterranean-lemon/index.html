<!doctype html>
<!-- Mediterranean Lemon · page 1 — envelope landing (/<slug>). W1.1 comp: a sunlit white plaster wall fading to sky blue,
     lemon branches in the top-left and bottom-right corners, "YOU ARE INVITED", the names in a breezy script, the white
     envelope with the scalloped cobalt-edged V flap and the lemon tie (a lemon, two leaves and a blossom sprig tied with a
     cobalt ribbon) on its tip, "TAP TO OPEN". Opening (catalogue, docs/11 §7.3): on tap the lemon tie slips loose and
     rolls away, the white flap opens upward to reveal the blue-and-white tile liner, and the card rises while a lemon
     branch sways in from the top corner and a blossom drifts down; the card comes forward and flies to home (view
     transition). Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server
     (platform/README.md). Thank-you mode (G075, data-if="thank_you_on"): the same envelope and opening; the card carries
     the couple's thank-you title and the date, its window the thank-you photo or — without one — the sky-blue wall and the
     lemon tie (never a photo placeholder). Design texts: data-copy (G068, theme.json "copy").
     Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#F6F1E9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:88.6%;ascent-override:90.3%;descent-override:50.8%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:76.2%;ascent-override:105.1%;descent-override:59.1%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<style>.js:not(.parts-on) img[data-defer]{display:none!important}</style>
<script>/* deferred opening parts (G180, docs/11 §6): the images that only show after the tap ([data-defer], lazy) wait until the
   closed object's own high-priority image(s) in .stage have loaded and painted, then all load at once — before the tap, so the opening never waits */
(function(d,r){var on=function(){r.classList.add('parts-on')};if(r.classList.contains('is-opened'))return on();addEventListener('pointerdown',on,true);addEventListener('keydown',on,true);addEventListener('load',on);d.addEventListener('DOMContentLoaded',function(){var h=d.querySelectorAll('.stage img[fetchpriority=high]');h=h.length?h:d.querySelectorAll('img[fetchpriority=high]');var n=h.length,one=function(){--n||requestAnimationFrame(function(){setTimeout(on)})};if(!n)on();h.forEach(function(i){i.complete?one():(i.addEventListener('load',one),i.addEventListener('error',one))})})})(document,document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the sunlit plaster wall (two flower-free crops of bg_page) + the two GPT lemon branches as separate
     layers, each whole on screen; loose leaves and blossoms resting on the wall -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/wall_wide-640.webp">
    <img class="scene-img" src="img/wall-540.webp" alt="" fetchpriority="high">
  </picture>
  <img class="corner corner-tl" src="img/decor_tl-480.webp" srcset="img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w, img/decor_tl-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(32vw, 52vh, 500px), min(60vw, 30svh, 330px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-720.webp 720w, img/decor_br-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(32vw, 52vh, 500px), min(62vw, 31svh, 340px)" alt="">
  <!-- the comp's loose pieces on the wall (GPT accents: a lemon leaf, two blossoms) -->
  <img class="float f-leaf" src="img/accent_3-200.webp" alt="">
  <img class="float f-bloom" src="img/accent_2-200.webp" alt="">
  <img class="float f-bloom2" src="img/accent_2-200.webp" alt="">
  <img class="float f-leaf2" src="img/accent_3-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-defer loading="lazy" fetchpriority="low" decoding="async" data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(29vw, 152px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same window, else the sky-blue wall and the lemon tie (decoration) -->
            <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(29vw, 152px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-640.webp 640w" sizes="min(26vw, 136px)" alt=""></span>
          </div>
          <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(47vw, 245px)" alt="">
          <div class="card-copy">
            <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
          </div>
        </div>
      </div>
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img class="env-closed" src="img/env_closed-440.webp" srcset="img/env_closed-440.webp 440w, img/env_closed-880.webp 880w" sizes="min(84vw, 440px)" alt="" fetchpriority="high">
      <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <!-- the lemon tie: its own layer on the flap's tip — it slips loose and rolls away before the flap lifts -->
      <div class="closure"><img src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-640.webp 640w" sizes="min(32vw, 168px)" alt=""></div>
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
