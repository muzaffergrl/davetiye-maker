<!doctype html>
<!-- Mediterranean Lemon · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the breezy script, "MOMENTS WE
     HOLD DEAR", three scalloped portrait frames of hand-painted cobalt-and-white majolica tiles standing perfectly straight
     in a gentle staggered column down the page (left, right, left) like painted tile panels set into the sunlit plaster
     wall, never overlapping; a little lemon sprig tucked at a corner of each, loose leaves and blossoms on the wall, a
     caption with each panel. Catalogue: the frames turn in like tile panels (site.css preset "turn-l" / "turn-r": each
     panel swings in on its outer edge and stands straight). Phones: the same column, each panel 64vw (photo window
     ≥ 38vw, docs/11 §9), captions under the panels; from 720 px the comp's two staggered columns; desktop (≥ 1024 px
     landscape) one staggered row = one fold unit, sized to end above the nav (site.js tiles). Photo slots story_1..3
     (theme.json → media.memory_photos.0..2), captions story.items.0..2.caption. The whole page is off (404) when
     optional_blocks.our_story is false. Kicker / title = design copy. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="Our Story · {name_display}">Our Story</title>
<meta name="description" data-attr-content="Our Story · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="Our Story · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#F6F1E9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-aspect-ratio: 3/4)" srcset="img/wall_wide-640.webp">
        <img class="scene-img" src="img/wall-540.webp" alt="">
      </picture>
      <img class="corner corner-tl" data-step="decor" data-a="sway-tl" src="img/decor_tl-480.webp" srcset="img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w, img/decor_tl-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(30vw, 48vh, 400px), min(50vw, 360px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="sway-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-720.webp 720w, img/decor_br-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(32vw, 52vh, 460px), min(54vw, 30svh, 340px)" alt="">
      <img class="float f-leaf" data-step="decor" data-a="fade" src="img/accent_3-200.webp" alt="">
      <img class="float f-bloom" data-step="decor" data-a="fade" src="img/accent_2-200.webp" alt="">
      <img class="float f-bloom2" data-step="decor" data-a="fade" src="img/accent_2-200.webp" alt="">
    </div>
    <h1 class="script page-title" data-step="title" data-a="write">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold>Moments we hold dear</p>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the tile panels: one scene each, so each one turns in as it comes into view (left, right, left) -->
  <section class="tiles" aria-label="Our photos">
    <figure class="tile t-1" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="turn-l">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 1024px) min(16.4vw, 242px), (min-width: 720px) 152px, min(39vw, 200px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(27vw, 400px), (min-width: 720px) 250px, min(64vw, 330px)" alt="">
        <img class="sprig-tuck" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="(min-width: 1024px) min(15.7vw, 232px), (min-width: 720px) 145px, min(38vw, 192px)" alt="">
        <img class="tuck-bloom" src="img/accent_2-200.webp" alt="">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
      <img class="wall-piece wp-leaf" data-step="caption" data-a="fade" src="img/accent_3-200.webp" alt="">
      <img class="wall-piece wp-bloom" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="">
    </figure>
    <figure class="tile t-2" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="turn-r">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 1024px) min(16.4vw, 242px), (min-width: 720px) 152px, min(39vw, 200px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(27vw, 400px), (min-width: 720px) 250px, min(64vw, 330px)" alt="" loading="lazy">
        <img class="sprig-tuck" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="(min-width: 1024px) min(15.7vw, 232px), (min-width: 720px) 145px, min(38vw, 192px)" alt="" loading="lazy">
        <img class="tuck-bloom" src="img/accent_2-200.webp" alt="" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
      <img class="wall-piece wp-bloom" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="" loading="lazy">
      <img class="wall-piece wp-leaf" data-step="caption" data-a="fade" src="img/accent_3-200.webp" alt="" loading="lazy">
    </figure>
    <figure class="tile t-3" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="turn-l">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 1024px) min(16.4vw, 242px), (min-width: 720px) 152px, min(39vw, 200px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(27vw, 400px), (min-width: 720px) 250px, min(64vw, 330px)" alt="" loading="lazy">
        <img class="sprig-tuck" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="(min-width: 1024px) min(15.7vw, 232px), (min-width: 720px) 145px, min(38vw, 192px)" alt="" loading="lazy">
        <img class="tuck-bloom" src="img/accent_2-200.webp" alt="" loading="lazy">
      </div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
      <img class="wall-piece wp-leaf" data-step="caption" data-a="fade" src="img/accent_3-200.webp" alt="" loading="lazy">
      <img class="wall-piece wp-bloom" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="" loading="lazy">
    </figure>
  </section>

  <section class="section next-sec wash-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="sway-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-720.webp 720w, img/decor_br-960.webp 960w" sizes="min(56vw, 330px)" alt="" loading="lazy">
    <img class="sprig" data-step="sprig" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="150px" alt="" loading="lazy">
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise">The Day <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <span class="orn" aria-hidden="true"><img src="img/tile_flower-73.webp" alt=""></span>
  <ul>
    <li><a href="home.html"><span>Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span>Story</span></a></li>
    <li><a href="details.html"><span>Details</span></a></li>
    <li data-if="!rsvp.method"><a href="rsvp.html"><span>RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
