<!doctype html>
<!-- Velvet Jewel Box · page 1 — the closed ring box (/<slug>). Aubergine velvet ground, "YOU ARE INVITED", the names in
     Pinyon Script with a champagne foil shimmer, the closed velvet box tied with a satin bow, "TAP TO OPEN". Opening
     (site.js MOTION.envelope — the standard key; here the box): on tap the bow slides off, the box gives a small press,
     the lid turns back on its hinge and its satin-lined inside takes over at 90°, a light sweep crosses the satin, the
     invitation card rises out of the box, comes forward and flies to home (view transition invite-card → the home hero).
     Bow, lid, inner lid, cushion, base and card are separate layers (build_images.py; interim stand-ins until the
     PAKET 5 parts, GPT_PROMPTS.md). Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the
     server. Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its window the
     thank-you photo or — without one — the satin bow. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0b1a">
<title data-text="{name_display} · {copy.envelope_kicker}">Velvet Jewel Box</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Pinyon+Script&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:91%;ascent-override:94.5%;descent-override:41.8%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:78.2%;ascent-override:109.9%;descent-override:48.6%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names foil" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="box">
      <!-- manifest stage.inner / .well / .card / .base / .lid / .closure (img/manifest.json) -->
      <img class="box-inner" src="img/box_inner-440.webp" srcset="img/box_inner-440.webp 440w, img/box_inner-680.webp 680w" sizes="min(78vw, 41svh, 400px)" alt="">
      <span class="box-sheen" aria-hidden="true"></span>
      <img class="box-well" src="img/box_well-440.webp" srcset="img/box_well-440.webp 440w, img/box_well-704.webp 704w" sizes="min(81vw, 42svh, 415px)" alt="">
      <div class="card" aria-hidden="true">
        <img class="card-img" src="img/card_paper-480.webp" srcset="img/card_paper-480.webp 480w, img/card_paper-860.webp 860w" sizes="min(50vw, 27svh, 260px)" alt="">
        <div class="card-copy">
          <div class="card-photo photo-slot" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(14vw, 80px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(14vw, 80px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/closure-160.webp" alt=""></span>
          </div>
          <div class="card-text">
            <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
            <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
            <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="eyebrow" data-field="date"></p>
          </div>
        </div>
      </div>
      <img class="box-base" src="img/box_base-440.webp" srcset="img/box_base-440.webp 440w, img/box_base-716.webp 716w" sizes="min(84vw, 44svh, 430px)" alt="" fetchpriority="high">
      <img class="box-lid" src="img/box_lid-440.webp" srcset="img/box_lid-440.webp 440w, img/box_lid-732.webp 732w" sizes="min(86vw, 45svh, 440px)" alt="" fetchpriority="high">
      <span class="lid-sheen" aria-hidden="true"></span>
      <img class="box-closure" src="img/closure-160.webp" srcset="img/closure-160.webp 160w, img/closure-236.webp 236w" sizes="min(28vw, 15svh, 142px)" alt="">
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
