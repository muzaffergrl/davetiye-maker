<!doctype html>
<!-- Kintsugi & Washi · page 1 — the folded invitation (/<slug>). Indigo washi ground, "You are invited", the names in
     Allura gold, the closed packet: indigo washi folded over a rice-paper card like origami, a rice-paper band round
     its middle, "Tap to open". Opening (docs/24, site.js MOTION.envelope): on tap the band slides off, a soft gold light
     passes over the paper, then the folds open one by one — the top fold turns up, the bottom fold turns down, the
     left and the right panels turn out (each fold shows its paler inside from 90° on) — the rice-paper card with the
     portrait, "Our wedding", the names and the date lifts, comes forward and flies to home (view transition invite-card
     → the home hero card). Band, four folds and card are separate layers; the paper is GPT texture cut and toned by
     build_images.py (interim until the PAKET 5 parts, GPT_PROMPTS.md). Personal text: none — [data-field] /
     [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the card carries the
     thank-you title and the date, its window the thank-you photo or — without one — indigo washi. Design texts:
     data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161c36">
<title data-text="{name_display} · {copy.envelope_kicker}">Kintsugi &amp; Washi</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Shippori+Mincho:wght@400;600&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="fold">
      <!-- the rice-paper card inside the folds (interim: rice paper toned from GPT texture; card_small with a #00FF00
           window replaces it, GPT_PROMPTS.md W2.3) -->
      <div class="card" aria-hidden="true">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(26vw, 190px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(26vw, 190px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/washi_indigo-640.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the four folds, opened in the reverse of the order they were folded: top, bottom, left, right. Each fold has
           its outside (indigo washi) and its inside (paler washi, shown from 90° on). -->
      <div class="flap f-right"><span class="face out"></span><span class="face in"></span></div>
      <div class="flap f-left"><span class="face out"></span><span class="face in"></span></div>
      <div class="flap f-bottom"><span class="face out"></span><span class="face in"></span></div>
      <div class="flap f-top"><span class="face out"></span><span class="face in"></span></div>
      <!-- closure: the rice-paper band round the middle -->
      <span class="band"></span>
      <!-- a soft gold light passing over the paper (light only, docs/11 §5.7) -->
      <span class="sheen"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
