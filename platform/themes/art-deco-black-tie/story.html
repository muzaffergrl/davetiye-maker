<!doctype html>
<!-- Art Deco Black-Tie · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in tall deco capitals, "MOMENTS WE
     HOLD DEAR", a gold divider, three stepped gold art deco arch frames standing side by side like ballroom doorways (the
     middle one taller), a faint diagonal sweep of gold light crossing them, a caption in deco capitals over a small divider
     under each; gold rays, the corner clusters, coupe / starburst / fan. Catalogue: the frames appear with a sweep of light
     (site.css preset "sweep": each frame lights up from the dark as a borderless band of gold light crosses it).
     Phones (docs/11 §9, photo window ≥ 38vw): the doorways descend like a staircase — left, centre, right — each frame
     52vw (the middle 56vw, still the tallest), window ≥ 43vw; from 900 px wide the comp's row (middle taller), one fold
     unit sized to end above the nav (site.js tiles). Photo slots story_1..3 (theme.json → media.memory_photos.0..2),
     captions story.items.0..2.caption. The whole page is off (404) when optional_blocks.our_story is false. Kicker /
     title = design copy (data-copy, G068). Thank-you mode (G075): unchanged; with the Day page hidden by the couple the
     closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#0A1729">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Josefin+Sans:wght@400;600&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:88.7%;ascent-override:104.8%;descent-override:28.2%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:87%;ascent-override:106.9%;descent-override:28.7%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <img class="rays" data-step="decor" data-a="fade" src="img/rays-1024.webp" alt="">
      <img class="corner corner-tl" data-step="decor" data-a="glide-tl" src="img/decor_tl-320.webp" srcset="img/decor_tl-320.webp 320w, img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(20vw, 36vh, 300px), min(30vw, 190px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="glide-br" src="img/decor_br-320.webp" srcset="img/decor_br-320.webp 320w, img/decor_br-480.webp 480w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(20vw, 36vh, 300px), min(32vw, 18svh, 200px)" alt="">
      <img class="float f-coupe" data-step="decor" data-a="fade" src="img/accent_1-162.webp" alt="">
      <img class="float f-star" data-step="decor" data-a="fade" src="img/accent_3-195.webp" alt="">
      <img class="float f-fan" data-step="decor" data-a="fade" src="img/accent_2-194.webp" alt="">
    </div>
    <h1 class="deco page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <img class="head-orn" data-step="orn" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="170px" alt="">
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the three doorways: one scene each, so each one lights up as it comes into view (left, centre, right) -->
  <section class="tiles" aria-label="Our photos">
    <figure class="tile t-1" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="sweep">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 900px) min(20vw, 230px), min(44vw, 251px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-194.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-635.webp 635w" sizes="(min-width: 900px) min(24vw, 275px), min(52vw, 300px)" alt="">
      </div>
      <figcaption class="deco" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(34vw, 130px)" alt="">
    </figure>
    <figure class="tile t-2" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="sweep">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 900px) min(22.4vw, 258px), min(47vw, 272px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-194.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-635.webp 635w" sizes="(min-width: 900px) min(27vw, 308px), min(56vw, 325px)" alt="" loading="lazy">
      </div>
      <figcaption class="deco" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(34vw, 130px)" alt="" loading="lazy">
    </figure>
    <figure class="tile t-3" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="sweep">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 900px) min(20vw, 230px), min(44vw, 251px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-194.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-635.webp 635w" sizes="(min-width: 900px) min(24vw, 275px), min(52vw, 300px)" alt="" loading="lazy">
      </div>
      <figcaption class="deco" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(34vw, 130px)" alt="" loading="lazy">
    </figure>
  </section>

  <section class="section next-sec page-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="glide-br" src="img/decor_br-320.webp" srcset="img/decor_br-320.webp 320w, img/decor_br-480.webp 480w, img/decor_br-720.webp 720w" sizes="min(44vw, 260px)" alt="" loading="lazy">
    <img class="sec-orn" data-step="orn" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="200px" alt="" loading="lazy">
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <img class="orn" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="220px" alt="" aria-hidden="true">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
