<!doctype html>
<!-- Riad Lantern Nights · page 1 — the closed doors (/<slug>). A night-teal courtyard wall, a lantern's glow above,
     "BEYOND THE CEDAR DOORS", the names in Cinzel, two cedar door leaves shut in the wall, "TAP TO OPEN". Opening
     (kapi, docs/11 §7.4 — riad doors swing IN, away from the guest): the doors give a little, the lantern flares, the two
     leaves turn on their outer hinges into the courtyard (the right one a beat after the left), warm lantern light pours
     out through the widening gap and the courtyard brightens; the ivory card — your portrait, "Our wedding", the names,
     the date — comes forward through the doorway and flies to home (view transition invite-card → the home card).
     Leaves, courtyard, light and card are separate layers. Interim pieces (build_images.py) until the PAKET 5 parts
     (GPT_PROMPTS.md). Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server.
     Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its window the thank-you
     photo or — without one — a zellige tile of the design. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f31">
<title data-text="{name_display} · {copy.envelope_kicker}">Riad Lantern Nights</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="Beyond the cedar doors">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Marcellus&family=Marcellus+SC&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Beyond the cedar doors</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <!-- the lantern's light above the doorway: CSS light only (docs/11 §5.7), flickers softly -->
    <span class="lantern-glow" aria-hidden="true"></span>
    <!-- GPT layers (hidden until build_images.py finds their parts): the pierced brass lantern hanging in the arch, and
         the carved doorway surround in front of the leaves -->
    <span class="lantern" aria-hidden="true"></span>
    <div class="riad">
      <img class="court" src="img/court-440.webp" srcset="img/court-440.webp 440w, img/court-880.webp 880w" sizes="min(66vw, calc(48svh * .76), 330px)" alt="">
      <span class="pour" aria-hidden="true"></span>
      <div class="card" aria-hidden="true">
        <img class="card-img" src="img/card_paper-480.webp" srcset="img/card_paper-480.webp 480w, img/card_paper-878.webp 878w" sizes="min(46vw, calc(34svh * .76), 232px)" alt="">
        <div class="card-copy">
          <div class="card-photo photo-slot" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(24vw, 120px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(24vw, 120px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/tile_3-76.webp" alt=""></span>
          </div>
          <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
          <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
          <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
          <p class="eyebrow card-date" data-field="date"></p>
        </div>
      </div>
      <img class="door door-l" src="img/door_l-240.webp" srcset="img/door_l-240.webp 240w, img/door_l-477.webp 477w" sizes="min(33vw, calc(24svh * .76), 165px)" alt="" fetchpriority="high">
      <img class="door door-r" src="img/door_r-240.webp" srcset="img/door_r-240.webp 240w, img/door_r-477.webp 477w" sizes="min(33vw, calc(24svh * .76), 165px)" alt="" fetchpriority="high">
      <span class="doorway" aria-hidden="true"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
