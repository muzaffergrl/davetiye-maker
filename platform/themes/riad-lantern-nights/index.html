<!doctype html>
<!-- Riad Lantern Nights · page 1 — the closed envelope (/<slug>). Redesign of 2026-10-22 (docs/35, G427). On warm ivory
     tadelakt plaster "Together with their families" and the names in Cinzel; below them a portrait deep-teal cotton-paper
     envelope with an upside-down horseshoe-arch flap edged in gold zellige foil, closed by a saffron silk cord looped
     once round a domed brass stud — a saffron tassel on one end, a small pierced brass lantern charm on the other; under
     it the date · the city and "Tap to open".
     Opening (site.js MOTION.envelope): on tap the lantern lights up (the unlit and the lit GPT lantern crossfade in
     place, its warm light falls on the envelope and the wall), the cord's loop lifts off the stud and cord, tassel and
     lantern swing down and fall away as the lantern goes out, the arch flap swings up on its top edge in 3D onto its
     zellige inside and stands above the envelope like an arched door, the arch-topped ivory card rises from behind the
     pocket and comes forward, bougainvillea bracts, orange blossoms, brass stars and motes of light drift, and the card
     flies to home (view transition invite-card → the home card). Back, card, pocket, flap (outside with its stud +
     inside), cord and the two lanterns are separate layers, all GPT pixels cut by build_images.py. Personal text: none —
     [data-field] / [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the
     card carries the thank-you title and the date, its arch the thank-you photo or — without one — a piece of the
     zellige. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe3cc">
<title data-text="{name_display} · {copy.envelope_kicker}">Riad Lantern Nights</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Marcellus&family=Marcellus+SC&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:113%;ascent-override:89%;descent-override:35%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:104%;ascent-override:97%;descent-override:38%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Together with their families</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <span class="glow" aria-hidden="true"></span>
    <div class="envelope">
      <!-- the back with its zellige lining, then the arch-topped card in the pocket -->
      <span class="back"></span>
      <div class="card" aria-hidden="true">
        <div class="card-photo frame arch">
          <div class="photo-slot" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_arch-640.webp" sizes="min(22vw, 100px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_arch-640.webp" sizes="min(22vw, 100px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/zellige-320.webp" alt=""></span>
          </div>
          <span class="cut"></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the front pocket, the horseshoe-arch flap (outside with the brass stud / zellige inside) hinged on the top
           edge, and the closure: the saffron cord looped round the stud with its tassel, and the lantern charm (unlit and
           lit, crossfaded) on its jump ring -->
      <span class="front"></span>
      <span class="flap"><span class="flap-out"><span class="stud"></span></span><span class="flap-in"></span></span>
      <span class="closure">
        <span class="cord"></span>
        <span class="lantern"><span class="lantern-off"></span><span class="lantern-on"></span></span>
      </span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
