<!doctype html>
<!-- Riad Lantern Nights · page 3 — story (/<slug>/story). Three tall windows in the courtyard wall: the first wide and
     alone, the next two side by side under it (an arcade of three on wide screens). Each photo waits in the dark and
     comes out as lantern light reaches it — a soft beam that crosses it once, then stays as a glow that follows the
     scroll (CSS light only, docs/11 §5.7). Each opens in a quiet viewer (native <dialog>, arrows, Escape).
     Personal text: none — the intro, captions and photos are filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f31">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Marcellus&family=Marcellus+SC&display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="gallery-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments we hold dear</p>
    <h1 data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <!-- the zellige row lays itself under the heading (preset "tile") -->
  <div class="zellige" aria-hidden="true" data-scene="story-tiles"><img src="img/tile_2-76.webp" srcset="img/tile_2-76.webp 76w, img/tile_2-152.webp 152w" sizes="(min-width: 760px) 50px, 38px" alt="" data-step="tile" data-a="tile" data-i="0"><img src="img/tile_4-76.webp" srcset="img/tile_4-76.webp 76w, img/tile_4-152.webp 152w" sizes="(min-width: 760px) 50px, 38px" alt="" data-step="tile" data-a="tile" data-i="1"><img src="img/tile_3-76.webp" srcset="img/tile_3-76.webp 76w, img/tile_3-152.webp 152w" sizes="(min-width: 760px) 50px, 38px" alt="" data-step="tile" data-a="tile" data-i="2"><img src="img/tile_4-76.webp" srcset="img/tile_4-76.webp 76w, img/tile_4-152.webp 152w" sizes="(min-width: 760px) 50px, 38px" alt="" data-step="tile" data-a="tile" data-i="3"><img src="img/tile_2-76.webp" srcset="img/tile_2-76.webp 76w, img/tile_2-152.webp 152w" sizes="(min-width: 760px) 50px, 38px" alt="" data-step="tile" data-a="tile" data-i="4"></div>
  <section class="gallery-grid" aria-label="Photographs" data-scene="story-frame">
    <figure class="gallery-item item-1" data-step="frame" data-a="light" data-i="0">
      <button class="photo-slot window" data-slot="story_1" type="button" data-gallery-open="0">
        <img data-photo="story_1" src="img/ph_window-480.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="(min-width: 760px) 300px, min(76vw, 340px)" fetchpriority="high">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        <span class="arch" aria-hidden="true"></span>
      </button>
      <figcaption><span class="num" aria-hidden="true">01</span> <span data-field="story.items.0.caption"></span></figcaption>
    </figure>
    <figure class="gallery-item item-2" data-step="frame" data-a="light" data-i="1">
      <button class="photo-slot window" data-slot="story_2" type="button" data-gallery-open="1">
        <img data-photo="story_2" src="img/ph_window-480.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="(min-width: 760px) 300px, calc(50vw - 30px)" loading="lazy">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        <span class="arch" aria-hidden="true"></span>
      </button>
      <figcaption><span class="num" aria-hidden="true">02</span> <span data-field="story.items.1.caption"></span></figcaption>
    </figure>
    <figure class="gallery-item item-3" data-step="frame" data-a="light" data-i="2">
      <button class="photo-slot window" data-slot="story_3" type="button" data-gallery-open="2">
        <img data-photo="story_3" src="img/ph_window-480.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="(min-width: 760px) 300px, calc(50vw - 30px)" loading="lazy">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        <span class="arch" aria-hidden="true"></span>
      </button>
      <figcaption><span class="num" aria-hidden="true">03</span> <span data-field="story.items.2.caption"></span></figcaption>
    </figure>
  </section>
  <dialog class="lightbox" data-copy-attr="aria-label:album_viewer" aria-label="Photograph viewer">
    <button class="lightbox-close" type="button" data-copy-attr="aria-label:album_close" aria-label="Close photograph">×</button>
    <!-- the viewer's <img> is made by site.js on first open (an empty <img> would count as a broken image) -->
    <p class="lightbox-caption"></p>
    <div class="lightbox-actions">
      <button type="button" data-gallery-prev data-copy-attr="aria-label:album_previous" aria-label="Previous photograph">←</button>
      <span data-gallery-count></span>
      <button type="button" data-gallery-next data-copy-attr="aria-label:album_next" aria-label="Next photograph">→</button>
    </div>
  </dialog>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The evening unfolds</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
