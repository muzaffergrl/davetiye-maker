<!doctype html>
<!-- Painted Lily Pond · page 3 — story (/<slug>/story). Three moments down the canvas, left, right, left: each photo in
     a stretched canvas panel with painted edges (GPT W10): as its scene scrolls into view it comes in soft and saturated
     under the canvas grain, like a painting, then sharpens into the photograph; its number and caption come up after it.
     Lily pads drift and a dragonfly hovers between the moments (GPT W14). Personal text: none — the intro, captions and
     photos are filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eedf">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Comforter+Brush&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:94.2%;ascent-override:106.2%;descent-override:40.3%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:81%;ascent-override:123.5%;descent-override:46.9%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <span class="lilies" aria-hidden="true" data-step="kicker"></span>
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments we hold dear</p>
    <h1 data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <!-- lily pads drift and a dragonfly hovers between the moments (GPT W14) -->
  <span class="drift pad p-1" aria-hidden="true"></span>
  <span class="drift pad p-2" aria-hidden="true"></span>
  <span class="drift fly" aria-hidden="true"></span>
  <figure class="moment m-1" data-scene="story-frame">
    <div class="frame pano painted moment-photo" data-step="photo">
      <div class="photo-slot" data-slot="story_1">
        <img data-photo="story_1" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(64vw, 340px)" fetchpriority="high">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
      </div>
      <span class="cut" aria-hidden="true"></span>
      <span class="tex" aria-hidden="true"></span>
    </div>
    <figcaption data-step="caption"><span class="num" aria-hidden="true">01</span> <span data-field="story.items.0.caption"></span></figcaption>
  </figure>
  <figure class="moment m-2" data-scene="story-frame">
    <div class="frame pano painted moment-photo" data-step="photo">
      <div class="photo-slot" data-slot="story_2">
        <img data-photo="story_2" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(58vw, 310px)" loading="lazy">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
      </div>
      <span class="cut" aria-hidden="true"></span>
      <span class="tex" aria-hidden="true"></span>
    </div>
    <figcaption data-step="caption"><span class="num" aria-hidden="true">02</span> <span data-field="story.items.1.caption"></span></figcaption>
  </figure>
  <figure class="moment m-3" data-scene="story-frame">
    <div class="frame pano painted moment-photo" data-step="photo">
      <div class="photo-slot" data-slot="story_3">
        <img data-photo="story_3" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(64vw, 340px)" loading="lazy">
        <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
      </div>
      <span class="cut" aria-hidden="true"></span>
      <span class="tex" aria-hidden="true"></span>
    </div>
    <figcaption data-step="caption"><span class="num" aria-hidden="true">03</span> <span data-field="story.items.2.caption"></span></figcaption>
  </figure>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
