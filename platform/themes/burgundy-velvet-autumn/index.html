<!doctype html>
<!-- Burgundy Velvet Autumn · page 1 — envelope landing (/<slug>). W1.1 comp: a warm candlelit peach wall with golden
     bokeh, burgundy dahlia clusters in the top-left and bottom-right corners, a copper maple leaf, petals and blackberries
     on the wall; "YOU ARE INVITED" in engraved Roman capitals, the names in a copperplate script, the cream envelope with a
     straight rectangular flap, wrapped both ways in a burgundy velvet ribbon tied in a bow with a small gold oak-leaf charm
     at the knot, "TAP TO OPEN" over a hairline with the charm. Opening (catalogue, docs/11 §7.3): on tap the velvet bow
     unties and the ribbon slides off the envelope's sides, the rectangular flap lifts, and the card rises in warm
     candlelight while a single copper leaf drifts down; the card comes forward and flies to home (view transition).
     Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server (platform/README.md).
     Thank-you mode (G075, data-if="thank_you_on"): the same envelope and opening; the card carries the couple's thank-you
     title and the date, its window the thank-you photo or — without one — the candlelit wall and the velvet bow (never a
     photo placeholder). Design texts: data-copy (G068, theme.json "copy"). Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#F2D4BE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Pinyon+Script&amp;display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the candlelit wall (two flower-free crops of bg_page) + the two GPT dahlia clusters as separate layers,
     each whole on screen; a copper leaf, petals and blackberries resting on the wall -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/wall_wide-710.webp">
    <img class="scene-img" src="img/wall-560.webp" alt="" fetchpriority="high">
  </picture>
  <img class="corner corner-tl" src="img/florals_tl-480.webp" srcset="img/florals_tl-480.webp 480w, img/florals_tl-720.webp 720w, img/florals_tl-900.webp 900w" sizes="(min-aspect-ratio: 3/4) min(32vw, 52vh, 500px), min(58vw, 29svh, 320px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/florals_br-480.webp" srcset="img/florals_br-480.webp 480w, img/florals_br-720.webp 720w, img/florals_br-900.webp 900w" sizes="(min-aspect-ratio: 3/4) min(32vw, 52vh, 500px), min(56vw, 28svh, 310px)" alt="">
  <!-- the comp's loose pieces on the wall (GPT accents: a copper maple leaf, two dahlia petals, blackberries) -->
  <img class="float f-leaf" src="img/accent_1-194.webp" alt="">
  <img class="float f-petal" src="img/accent_2-129.webp" alt="">
  <img class="float f-berry" src="img/accent_3-200.webp" alt="">
  <img class="float f-petal2" src="img/accent_2-129.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <!-- warm candlelight behind the rising card (borderless light, docs/11 §5.7) -->
      <span class="glow" aria-hidden="true"></span>
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(25vw, 128px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img src="img/charm-48.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same window, else the candlelit wall and the velvet bow -->
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(25vw, 128px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img src="img/bow-320.webp" srcset="img/bow-320.webp 320w, img/bow-640.webp 640w" sizes="min(23vw, 120px)" alt=""></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(42vw, 220px)" alt="">
          <div class="card-copy">
            <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img class="env-closed" src="img/env_closed-440.webp" srcset="img/env_closed-440.webp 440w, img/env_closed-880.webp 880w" sizes="min(84vw, 440px)" alt="" fetchpriority="high">
      <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <!-- the velvet ribbon, cut at the knot (docs/11 §7.1): left half, the vertical band with the knot and the charm,
           right half — the bow unties and they slide off the envelope's sides before the flap lifts -->
      <div class="closure">
        <img class="cl-l" src="img/cl_l-193.webp" srcset="img/cl_l-193.webp 193w, img/cl_l-386.webp 386w" sizes="min(37vw, 194px)" alt="">
        <img class="cl-c" src="img/cl_c-57.webp" srcset="img/cl_c-57.webp 57w, img/cl_c-113.webp 113w" sizes="min(11vw, 57px)" alt="">
        <img class="cl-r" src="img/cl_r-194.webp" srcset="img/cl_r-194.webp 194w, img/cl_r-388.webp 388w" sizes="min(37vw, 195px)" alt="">
      </div>
    </div>
  </div>

  <div class="env-hint" aria-hidden="true"><p><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p><span class="orn"><img src="img/charm-48.webp" alt=""></span></div>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
