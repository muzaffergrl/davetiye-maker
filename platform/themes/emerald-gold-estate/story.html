<!doctype html>
<!-- Emerald & Gold Estate · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the ornate decorative capitals,
     "MOMENTS WE HOLD DEAR", a gold fern between two hairlines, then a gallery wall: three slim polished-gold frames of the
     same 3:4 shape in three sizes (large, medium, small) hung asymmetrically on the emerald velvet, a caption under each,
     small gold eucalyptus sprigs between the frames; gold line-art clusters in two corners. Catalogue: the frames are hung
     on the velvet wall one by one (site.css preset "hang": each drops onto its nail and settles with a small swing, the
     caption is written after it; the sprigs draw themselves). Phones: the three frames step down the wall left – right –
     left (large 72vw, medium 60vw, small 50vw: every photo window ≥ 38vw, docs/11 §9 — side by side they would be
     ~ 25vw), a sprig in the empty space beside each; from 720 px the comp's asymmetric wall in one row of three sizes (one
     fold unit). Photo slots story_1..3 (theme.json → media.memory_photos.0..2), captions story.items.0..2.caption. The
     whole page is off (404) when optional_blocks.our_story is false. Kicker / title = design copy (data-copy, G068).
     Thank-you mode (G075): unchanged; with the Day page hidden by the couple the closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#012314">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&amp;family=Cormorant+Infant:ital,wght@0,400..600;1,400..600&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-aspect-ratio: 3/4)" srcset="img/velvet_wide-896.webp">
        <img class="scene-img" src="img/velvet-600.webp" alt="">
      </picture>
      <img class="corner corner-tl" data-step="decor" data-a="draw-tl" src="img/decor_tl-360.webp" srcset="img/decor_tl-360.webp 360w, img/decor_tl-540.webp 540w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 46vh, 400px), min(50vw, 290px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="draw-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 48vh, 420px), min(48vw, 26svh, 290px)" alt="">
      <img class="float f-fern" data-step="decor" data-a="fade" src="img/accent_1-89.webp" alt="">
      <img class="float f-sprig" data-step="decor" data-a="fade" src="img/accent_3-113.webp" alt="">
    </div>
    <h1 class="display page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <span class="orn" data-step="kicker" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the gallery wall: one scene per frame — the frame is hung, then its caption is written, then the sprig draws itself -->
  <section class="wall" aria-label="Our photos">
    <figure class="pic p-1" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="hang">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 720px) min(32vw, 300px), min(65vw, 330px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-89.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-513.webp 513w" sizes="(min-width: 720px) min(35vw, 330px), min(72vw, 360px)" alt="">
      </div>
      <figcaption data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
      <img class="sprig" data-step="sprig" data-a="draw" src="img/accent_3-113.webp" alt="" loading="lazy">
    </figure>
    <figure class="pic p-2" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="hang">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 720px) min(24vw, 226px), min(55vw, 280px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-89.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-513.webp 513w" sizes="(min-width: 720px) min(26vw, 250px), min(60vw, 310px)" alt="" loading="lazy">
      </div>
      <figcaption data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
      <img class="sprig" data-step="sprig" data-a="draw" src="img/accent_3-113.webp" alt="" loading="lazy">
    </figure>
    <figure class="pic p-3" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="hang">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 720px) min(17vw, 160px), min(45vw, 230px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-89.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-513.webp 513w" sizes="(min-width: 720px) min(19vw, 180px), min(50vw, 260px)" alt="" loading="lazy">
      </div>
      <figcaption data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
      <img class="sprig" data-step="sprig" data-a="draw" src="img/accent_3-113.webp" alt="" loading="lazy">
    </figure>
  </section>

  <section class="section next-sec page-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="draw-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="min(54vw, 320px)" alt="" loading="lazy">
    <span class="orn" data-step="orn" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <span class="orn nav-orn" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
