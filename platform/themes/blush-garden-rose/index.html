<!doctype html>
<!-- Blush Garden Rose · page 1 — envelope landing (/<slug>). Closed envelope + bow → tap → the flap lifts, the card
     rises from behind the front pocket → home (the card morphs into the home hero card via a view transition).
     Template from G035 (collections/03_Blush_Garden_Rose/website). Personal text: none — every [data-field] /
     [data-text] / [data-photo] is filled on the server from the site's content record (platform/README.md, markers).
     "You are invited" / "We're getting married" = design copy. Visuals: GPT parts in img/ (build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-attr-content="You're invited · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-attr-content="You're invited · {date|date-long} · {venue.city_region}" content="You're invited">
<meta name="theme-color" content="#F2D8D7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Great+Vibes&amp;family=Lora:ital,wght@0,400;1,400&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop: painted scene on phones; mist + separate floral parts on landscape screens -->
<div class="scene-bg" aria-hidden="true" style="position:fixed">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/mist-640.webp">
    <img src="img/bg_scene-640.webp" srcset="img/bg_scene-640.webp 640w, img/bg_scene-1024.webp 1024w" sizes="67vh" alt="" fetchpriority="high">
  </picture>
  <img class="florals florals-tl land-only" src="img/florals_tl-480.webp" srcset="img/florals_tl-480.webp 480w, img/florals_tl-960.webp 960w" sizes="min(46vw, 68vh, 560px)" alt="" loading="lazy">
  <img class="florals florals-br land-only" src="img/florals_br-480.webp" srcset="img/florals_br-480.webp 480w, img/florals_br-960.webp 960w" sizes="min(46vw, 68vh, 560px)" alt="" loading="lazy">
</div>

<a class="skip" href="home.html" data-skip><span>Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker">You are invited</p>
    <h1 class="script names" data-fit="1.5" data-fit-min=".4"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="env">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-880.webp 880w" sizes="min(84vw, 44vh, 460px)" alt="">
      <img class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-880.webp 880w" sizes="min(84vw, 44vh, 460px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(36vw, 19vh, 180px)" alt="">
            <span class="ph-mark" aria-hidden="true"><img src="img/petal2-200.webp" alt=""><span>Your photo here</span></span>
          </div>
          <img src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(47vw, 25vh, 255px)" alt="">
          <div class="card-copy">
            <p class="script">We're getting married</p>
            <p class="kicker" data-field="date"></p>
            <p class="kicker" data-field="venue.city_region"></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/pocket-440.webp" srcset="img/pocket-440.webp 440w, img/pocket-880.webp 880w" sizes="min(84vw, 44vh, 460px)" alt="">
      <img class="env-closed" src="img/envelope_closed-440.webp" srcset="img/envelope_closed-440.webp 440w, img/envelope_closed-880.webp 880w" sizes="min(84vw, 44vh, 460px)" alt="">
      <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-880.webp 880w" sizes="min(84vw, 44vh, 460px)" alt="">
      <img class="env-ribbon" src="img/ribbon_bow-480.webp" srcset="img/ribbon_bow-480.webp 480w, img/ribbon_bow-960.webp 960w" sizes="min(84vw, 44vh, 460px)" alt="">
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap">Tap to open</span><span class="click">Click to open</span></p>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter>Enter</a>
    <button class="replay textlink" type="button">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html">Open the invitation</a></p>
</main>

</body>
</html>
