<!doctype html>
<!-- Nocturne Lake Estate · page 1 — envelope landing (/<slug>). Candle-dark ground, "AN EVENING BY THE LAKE", the names in
     Cinzel capitals, the black textured envelope with its gold wax seal, "TAP TO OPEN". Opening (docs/11 §7.3, kapak):
     on tap the seal lifts off and drops away, the flap turns up on its hinge and its inside (the flap mirrored, toned
     down) takes over at 90°, the charcoal card — the portrait, "Our wedding", the names, the date — rises out of the
     pocket, comes forward and flies to home (view transition invite-card → the home hero card). Seal, flap, inner flap,
     pocket and card are separate layers cut from the GPT envelope (build_images.py); interim until the PAKET 5 parts
     (GPT_PROMPTS.md). Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server.
     Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its window the thank-you
     photo or — without one — the gold seal. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11120f">
<title data-text="{name_display} · {copy.envelope_kicker}">Nocturne Lake Estate</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="An evening by the lake">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:101.3%;ascent-override:96.8%;descent-override:36.5%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:99.3%;ascent-override:98.7%;descent-override:37.3%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">An evening by the lake</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <!-- manifest stage.inner: the inside of the flap, above the hinge -->
      <img class="env-inner" src="img/env_inner-440.webp" srcset="img/env_inner-440.webp 440w, img/env_inner-880.webp 880w" sizes="min(86vw, 460px)" alt="">
      <img class="env-back" src="img/env_back-440.webp" srcset="img/env_back-440.webp 440w, img/env_back-880.webp 880w" sizes="min(86vw, 460px)" alt="">
      <div class="card" aria-hidden="true">
        <img class="card-img" src="img/card_paper-480.webp" srcset="img/card_paper-480.webp 480w, img/card_paper-621.webp 621w" sizes="min(56vw, 300px)" alt="">
        <div class="card-copy">
          <div class="card-photo photo-slot" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(17vw, 90px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(17vw, 90px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/env_seal-160.webp" alt=""></span>
          </div>
          <div class="card-text">
            <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
            <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
            <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="eyebrow" data-field="date"></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-880.webp 880w" sizes="min(86vw, 460px)" alt="" fetchpriority="high">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-880.webp 880w" sizes="min(86vw, 460px)" alt="" fetchpriority="high">
      <img class="env-seal" src="img/env_seal-160.webp" srcset="img/env_seal-160.webp 160w, img/env_seal-269.webp 269w" sizes="min(16vw, 84px)" alt="">
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
