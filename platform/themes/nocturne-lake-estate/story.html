<!doctype html>
<!-- Nocturne Lake Estate · page 3 — story (/<slug>/story). Redesign of 2026-10-22 (docs/35 row 22, G422). A narrow strip of
     the painted lake at night over the kicker, "Our Story" (a gold-leaf shimmer passes over it once) and the intro; below,
     three moments left – right – left, each in a lacquered villa window behind two charcoal louvred shutters: as a window
     enters the view its shutters open outward on their hinges and the photo warms out of the candlelit dark, then the
     caption comes up. With reduced motion the shutters stay open. Personal text: none — filled on the server. Design
     texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11120f">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:129.4%;ascent-override:75.7%;descent-override:28.6%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:111.3%;ascent-override:88%;descent-override:33.2%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <span class="night-strip" aria-hidden="true"></span>
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments by the water</p>
    <h1 class="foil" data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <span class="divider" aria-hidden="true"></span>
  <ol class="moments" aria-label="Photographs" data-copy-attr="aria-label:album_label">
    <li class="moment" data-scene="story-moment">
      <span class="frame storywin villa moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(58vw, 300px)" fetchpriority="high">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
        <span class="shutter sh-l" aria-hidden="true"></span>
        <span class="shutter sh-r" aria-hidden="true"></span>
      </span>
      <div class="moment-text" data-step="caption"><span class="num" aria-hidden="true">01</span><p data-field="story.items.0.caption"></p></div>
    </li>
    <li class="moment" data-scene="story-moment">
      <span class="frame storywin villa moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(58vw, 300px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
        <span class="shutter sh-l" aria-hidden="true"></span>
        <span class="shutter sh-r" aria-hidden="true"></span>
      </span>
      <div class="moment-text" data-step="caption"><span class="num" aria-hidden="true">02</span><p data-field="story.items.1.caption"></p></div>
    </li>
    <li class="moment" data-scene="story-moment">
      <span class="frame storywin villa moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(58vw, 300px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
        <span class="shutter sh-l" aria-hidden="true"></span>
        <span class="shutter sh-r" aria-hidden="true"></span>
      </span>
      <div class="moment-text" data-step="caption"><span class="num" aria-hidden="true">03</span><p data-field="story.items.2.caption"></p></div>
    </li>
  </ol>
  <span class="divider" aria-hidden="true"></span>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Evening</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
