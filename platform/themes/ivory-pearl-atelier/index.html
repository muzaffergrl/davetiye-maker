<!doctype html>

<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title data-text="{name_display} · {date}">Ivory Pearl Atelier</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.card_line} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.card_line} · {date|date-long} · {venue.city_region}" content="Our wedding">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">

<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>document.documentElement.classList.replace("no-js","js");</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope">
<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
 <div class="opening-bow" aria-hidden="true"><img class="bow-half bow-left" src="img/bow-640.webp" alt=""><img class="bow-half bow-right" src="img/bow-640.webp" alt=""></div>
 <header class="env-head"><p class="eyebrow" data-if="!thank_you_on" data-field="host_line"></p><p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
 <h1 class="names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
 <p class="opening-date" data-field="date"></p></header>
 <div class="stage" role="button" tabindex="0" aria-label="Open the envelope" data-copy-attr="aria-label:envelope_open">
  <div class="envelope">
   <img class="env-inside" src="img/inside-960.webp" alt="" aria-hidden="true">
   <div class="card-slot"><div class="card paper" aria-hidden="true">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
    <p class="card-names" data-field="name_display"></p><p class="card-date" data-field="date"></p>
    <p data-if="thank_you_on" data-field="thank_you_title"></p>
   </div></div>
   <img class="env-pocket" src="img/pocket-960.webp" alt="" aria-hidden="true">
   <div class="flap"><img class="flap-out" src="img/flap-960.webp" alt="" aria-hidden="true"><img class="flap-in" src="img/flap-inside-960.webp" alt="" aria-hidden="true"></div>
   <img class="env-closed" src="img/closed-960.webp" alt="" aria-hidden="true" fetchpriority="high">
  </div>
  <div class="closure"><img src="img/closure-320.webp" alt="" aria-hidden="true"><span class="pearl-light" aria-hidden="true"></span></div>
 </div>
 <p class="opening-hint" data-copy="envelope_hint_tap">Tap to open</p>
 <div class="opening-actions"><a class="btn" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a><button class="textlink replay" type="button" data-copy="envelope_replay">Replay the opening</button></div>
 <noscript><a class="btn" href="home.html" data-copy="envelope_enter">Enter</a></noscript>
</main></body></html>
