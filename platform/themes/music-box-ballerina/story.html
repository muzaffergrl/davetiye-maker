<!doctype html>
<!-- Music Box Ballerina · page 3 — story (/<slug>/story). The music box's mirror: the three photographs appear one at a
     time in the oval mirror of the open lid, as if reflected there; the next one comes in through a glint of light on
     the glass while the little ballerina at the mirror's foot turns a quarter. Swipe the mirror, the arrow buttons or
     ←/→/Home/End change the photo; the count is a polite live region. Without JavaScript or with reduced motion the
     same figures are a plain list of oval photos. Personal text: none — the intro, captions and photos are filled on the
     server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e4e2">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Gilda+Display&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:85.3%;ascent-override:132.4%;descent-override:90.2%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:73.4%;ascent-override:154%;descent-override:104.9%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Reflections</p>
    <h1  data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <section class="mirror-show" aria-roledescription="carousel" aria-label="Photographs" data-scene="story-frame">
    <div class="mirror-stage" data-step="frame">
      <div class="mirror-canvas">
        <img class="mirror-lid" src="img/lid_open-440.webp" srcset="img/lid_open-440.webp 440w, img/lid_open-880.webp 880w" sizes="min(150vw, 760px)" alt="" loading="lazy">
      </div>
      <div class="mirror-glass" data-mirror tabindex="0">
        <figure class="reflection" data-i="0">
          <div class="reflection-photo photo-slot" data-slot="story_1">
            <img data-photo="story_1" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(56vw, 300px)" fetchpriority="high">
            <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
          </div>
          <figcaption><span class="num" aria-hidden="true">01</span> <span data-field="story.items.0.caption"></span></figcaption>
        </figure>
        <figure class="reflection" data-i="1">
          <div class="reflection-photo photo-slot" data-slot="story_2">
            <img data-photo="story_2" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(56vw, 300px)" loading="lazy">
            <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
          </div>
          <figcaption><span class="num" aria-hidden="true">02</span> <span data-field="story.items.1.caption"></span></figcaption>
        </figure>
        <figure class="reflection" data-i="2">
          <div class="reflection-photo photo-slot" data-slot="story_3">
            <img data-photo="story_3" src="img/ph_portrait-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(56vw, 300px)" loading="lazy">
            <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
          </div>
          <figcaption><span class="num" aria-hidden="true">03</span> <span data-field="story.items.2.caption"></span></figcaption>
        </figure>
        <span class="glass" aria-hidden="true"></span>
      </div>
    </div>
    <span class="story-dancer" aria-hidden="true" data-step="frame" data-i="1"></span>
    <div class="mirror-controls" data-step="frame" data-i="2">
      <button type="button" data-mirror-prev data-copy-attr="aria-label:album_previous" aria-label="Previous photograph">←</button>
      <span class="mirror-count" data-mirror-count aria-live="polite"></span>
      <button type="button" data-mirror-next data-copy-attr="aria-label:album_next" aria-label="Next photograph">→</button>
    </div>
  </section>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The celebration</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
