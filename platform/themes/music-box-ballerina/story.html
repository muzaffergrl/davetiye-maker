<!doctype html>
<!-- Music Box Ballerina · page 3 — story (/<slug>/story). Redesign of 2026-10-22 (docs/35 row 32, G432). On blush silk
     satin the kicker, "Our Story" (a gold-leaf shimmer passes over it once), the intro and "In the mirror of the music
     box"; below, three moments left – right – left, each photo in a slender pearl-beaded oval mirror: as it scrolls in, the
     photo clears like a misted mirror (soft blur → sharp) and light passes over the glass; between the moments the little
     porcelain ballerina turns a quarter and back (front / back views, scaleX). Captions beside each photo. Personal text:
     none — filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e4e2">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Gilda+Display&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:85.4%;ascent-override:99.5%;descent-override:46.8%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:73.4%;ascent-override:115.7%;descent-override:54.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments we hold dear</p>
    <h1 class="foil" data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
    <span class="divider" aria-hidden="true" data-step="intro" data-i="1"></span>
    <p class="eyebrow mirror-line" data-copy="story_mirror" data-step="intro" data-i="2">In the mirror of the music box</p>
  </header>
  <section class="moments">
    <figure class="moment" data-scene="story-moment">
      <span class="frame mirror jewel moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_mirror-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(58vw, 300px)" fetchpriority="high">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">01</span> <span data-field="story.items.0.caption"></span></figcaption>
    </figure>
    <div class="turn-row" aria-hidden="true" data-scene="story-turn"><span class="figurine" data-step="turn"><span class="bal-front"></span><span class="bal-back"></span></span></div>
    <figure class="moment moment-right" data-scene="story-moment">
      <span class="frame mirror jewel moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_mirror-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(58vw, 300px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">02</span> <span data-field="story.items.1.caption"></span></figcaption>
    </figure>
    <div class="turn-row" aria-hidden="true" data-scene="story-turn"><span class="figurine" data-step="turn"><span class="bal-front"></span><span class="bal-back"></span></span></div>
    <figure class="moment" data-scene="story-moment">
      <span class="frame mirror jewel moment-photo" data-step="frame">
        <span class="photo-slot" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_mirror-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(58vw, 300px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">03</span> <span data-field="story.items.2.caption"></span></figcaption>
    </figure>
  </section>
  <footer class="signature" data-scene="story-next">
    <span class="divider" aria-hidden="true" data-step="names"></span>
    <p class="sig-names" data-field="name_display" data-step="names" data-i="1"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
