<!doctype html>
<!-- Music Box Ballerina · page 1 — the closed music box (/<slug>). Blush page ground, "YOU ARE INVITED", the names in
     Ballet, the closed rose-quartz lacquered box with its brass wind-up key, "TURN THE KEY". Opening (site.js
     MOTION.envelope — the standard key; here the music box): on tap the key turns twice, the box gives a small click,
     the lid swings up on its back hinge and its inside — the oval mirror with the couple's portrait — stands up, the
     ballerina rises from the satin well and turns slowly (GPT turn frames), a few rose petals drift down, the
     invitation card rises out of the box, comes forward and flies to home (view transition invite-card → the home
     hero). Key, lid, mirror lid, well, ballerina, card and box front are separate layers (build_images.py; interim
     stand-ins until the PAKET 5 parts, GPT_PROMPTS.md). Sound: the platform's opening cues after the guest's tap
     (lib/audio/catalog.ts), the sound button of /audio/audio.js mutes them. Personal text: none — [data-field] /
     [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the card carries the
     thank-you title and the date, the mirror the thank-you photo (or its empty glass). Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e4e2">
<title data-text="{name_display} · {copy.envelope_kicker}">Music Box Ballerina</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Gilda+Display&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:85.3%;ascent-override:132.4%;descent-override:90.2%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:73.4%;ascent-override:154%;descent-override:104.9%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <img class="opening-ground" src="img/bg_page-640.webp" srcset="img/bg_page-640.webp 640w, img/bg_page-1024.webp 1024w" sizes="(min-aspect-ratio: 2/3) 100vw, 150svh" alt="" fetchpriority="high">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <!-- manifest stage: every layer is the whole stage window of the 1024 × 1536 canvas, stacked at 100 % (bottom → top) -->
    <div class="box">
      <div class="lid-up">
        <div class="mirror photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(38vw, 20svh, 190px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(38vw, 20svh, 190px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/ph_portrait-640.webp" alt=""></span>
          <span class="glass" aria-hidden="true"></span>
        </div>
        <img class="lid-open" src="img/lid_open-440.webp" srcset="img/lid_open-440.webp 440w, img/lid_open-880.webp 880w" sizes="min(92vw, 44svh, 440px)" alt="">
      </div>
      <img class="interior" src="img/interior-440.webp" srcset="img/interior-440.webp 440w, img/interior-880.webp 880w" sizes="min(92vw, 44svh, 440px)" alt="">
      <span class="dancer" aria-hidden="true"></span>
      <div class="card" aria-hidden="true">
        <img class="card-img" src="img/card_paper-300.webp" srcset="img/card_paper-300.webp 300w, img/card_paper-500.webp 500w" sizes="min(45vw, 22svh, 215px)" alt="">
        <div class="card-copy">
          <p class="card-kicker" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
          <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
          <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
          <p class="card-date" data-field="date"></p>
        </div>
      </div>
      <img class="box-body" src="img/box_body-440.webp" srcset="img/box_body-440.webp 440w, img/box_body-880.webp 880w" sizes="min(92vw, 44svh, 440px)" alt="" fetchpriority="high">
      <img class="lid-closed" src="img/lid_closed-440.webp" srcset="img/lid_closed-440.webp 440w, img/lid_closed-880.webp 880w" sizes="min(92vw, 44svh, 440px)" alt="" fetchpriority="high">
      <img class="key" src="img/key-440.webp" srcset="img/key-440.webp 440w, img/key-880.webp 880w" sizes="min(92vw, 44svh, 440px)" alt="">
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Turn the key</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
