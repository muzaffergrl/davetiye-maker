<!doctype html>
<!-- Dusty Blue & Champagne · page 1 — envelope landing (/<slug>). W1.1 comp: dusty blue bokeh paper with ivory roses,
     eucalyptus and champagne-gold fern in the top-left and bottom-right corners, a few loose leaves and blossoms,
     "YOU ARE INVITED", the names in gold calligraphy, the ivory envelope with the gold-edged V flap and the dusty blue wax
     seal (+ eucalyptus sprig) pressed on its tip, "TAP TO OPEN". Opening (catalogue, docs/11 §7.3): on tap the wax seal
     breaks free and falls away, the V flap opens upward to reveal the patterned liner, and the card rises from behind the
     front pocket while a single eucalyptus leaf drifts down; the card comes forward and flies to home (view transition).
     Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server (platform/README.md).
     Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-attr-content="You're invited · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-attr-content="You're invited · {date|date-long} · {venue.city_region}" content="You're invited">
<meta name="theme-color" content="#CCDCEC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&amp;family=Pinyon+Script&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the bokeh paper (flower-free crop of bg_page) + the two GPT corner clusters as separate layers, each
     whole on screen, and the comp's loose leaves and blossoms (GPT accents) -->
<div class="scene-bg" aria-hidden="true">
  <img class="paper" src="img/paper-400.webp" alt="" fetchpriority="high">
  <img class="corner corner-tl" src="img/florals_tl-480.webp" srcset="img/florals_tl-480.webp 480w, img/florals_tl-960.webp 960w" sizes="(min-aspect-ratio: 1/1) min(30vw, 56svh, 460px), min(72vw, 37svh, 430px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/florals_br-480.webp" srcset="img/florals_br-480.webp 480w, img/florals_br-875.webp 875w" sizes="(min-aspect-ratio: 1/1) min(28vw, 54svh, 440px), min(74vw, 38svh, 440px)" alt="">
  <img class="float f-leaf" src="img/accent_1-149.webp" alt="">
  <img class="float f-bloom" src="img/accent_2-200.webp" alt="">
  <img class="float f-fern" src="img/accent_3-200.webp" alt="">
  <img class="float f-leaf2" src="img/accent_1-149.webp" alt="">
  <img class="float f-bloom2" src="img/accent_2-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span>Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker">You are invited</p>
    <h1 class="script names" data-fit="1.6"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="env">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-857.webp 857w" sizes="min(85vw, 445px)" alt="">
      <img class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-857.webp 857w" sizes="min(85vw, 445px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(43vw, 220px)" alt="">
            <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-638.webp 638w" sizes="min(51vw, 265px)" alt="">
          <div class="card-copy">
            <p class="script">We're getting married</p>
            <p class="kicker c-date" data-field="date"></p>
            <p class="kicker c-city" data-if="venue.city" data-field="venue.city"></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-857.webp 857w" sizes="min(85vw, 445px)" alt="">
      <img class="env-closed" src="img/env_closed-440.webp" srcset="img/env_closed-440.webp 440w, img/env_closed-857.webp 857w" sizes="min(85vw, 445px)" alt="" fetchpriority="high">
      <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-857.webp 857w" sizes="min(85vw, 445px)" alt="">
      <!-- the wax seal on the flap's tip: it breaks free and falls away first (not carried by the flap) -->
      <div class="closure" aria-hidden="true">
        <img src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-640.webp 640w" sizes="min(30vw, 157px)" alt="">
        <span class="seal-mono" data-field="initials"></span>
      </div>
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap">Tap to open</span><span class="click">Click to open</span></p>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter>Enter</a>
    <button class="replay textlink" type="button">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html">Open the invitation</a></p>
</main>

</body>
</html>
