<!doctype html>
<!-- Ivory Lace & Pearls · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the copperplate script,
     "MOMENTS WE HOLD DEAR" in spaced Bodoni capitals, three carved ivory-white oval frames, each hanging from a fine
     strand of pearls, descending to slightly different heights (left the highest, the middle the lowest), a caption in
     the script over a small strand of pearls under each; the lace-and-rose corners, the pearl drop, petals, the bow.
     Catalogue: the frames come down on their strands of pearls (site.css preset "descend": each frame lowers from above,
     swinging softly about the top of its strand until it settles) and a glint of light runs over the carved ivory and
     the pearls (preset "glint"). Phones (docs/11 §9, photo window ≥ 38vw): the frames hang in a zigzag — left, right,
     left — each 58vw wide (window ≥ 38.9vw), every strand rising beside the frame above it; from 900 px wide the comp's
     row (the strands' tops in line, the middle frame hung lowest), one fold unit sized to end above the nav (site.js
     tiles). The strands differ in length: each tile crops the GPT strand from its top (site.css --cut). Photo slots story_1..3
     (theme.json → media.memory_photos.0..2), captions story.items.0..2.caption. The whole page is off (404) when
     optional_blocks.our_story is false. Kicker / title = design copy (data-copy, G068). Thank-you mode (G075): unchanged;
     with the Day page hidden by the couple the closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#F1E7DE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&amp;family=Mrs+Saint+Delafield&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:73.6%;ascent-override:123.6%;descent-override:84.2%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:63.3%;ascent-override:143.8%;descent-override:98%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <img class="corner corner-tl" data-step="decor" data-a="glide-tl" src="img/decor_tl-320.webp" srcset="img/decor_tl-320.webp 320w, img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(22vw, 38vh, 320px), min(36vw, 210px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="glide-br" src="img/decor_br-320.webp" srcset="img/decor_br-320.webp 320w, img/decor_br-480.webp 480w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(22vw, 38vh, 320px), min(38vw, 20svh, 220px)" alt="">
      <img class="float f-drop" data-step="decor" data-a="fade" src="img/accent_1-96.webp" alt="">
      <img class="float f-petal" data-step="decor" data-a="fade" src="img/accent_2-200.webp" alt="">
    </div>
    <h1 class="script page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <img class="head-orn" data-step="orn" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="150px" alt="">
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the three hanging frames: one scene each, so each one comes down on its strand as it comes into view -->
  <section class="tiles" aria-label="Our photos">
    <figure class="tile t-1" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="descend"><div class="frame-in">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 900px) min(16vw, 190px), min(39vw, 222px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 900px) min(24vw, 280px), min(58vw, 330px)" alt="">
      </div></div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(30vw, 120px)" alt="">
    </figure>
    <figure class="tile t-2" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="descend"><div class="frame-in">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 900px) min(16vw, 190px), min(39vw, 222px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 900px) min(24vw, 280px), min(58vw, 330px)" alt="" loading="lazy">
      </div></div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(30vw, 120px)" alt="" loading="lazy">
    </figure>
    <figure class="tile t-3" data-scene="story-tile" data-fold>
      <div class="frame" data-step="panel" data-a="descend"><div class="frame-in">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 900px) min(16vw, 190px), min(39vw, 222px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 900px) min(24vw, 280px), min(58vw, 330px)" alt="" loading="lazy">
      </div></div>
      <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
      <img class="cap-orn" data-step="caption" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="min(30vw, 120px)" alt="" loading="lazy">
    </figure>
  </section>

  <section class="section next-sec page-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="glide-br" src="img/decor_br-320.webp" srcset="img/decor_br-320.webp 320w, img/decor_br-480.webp 480w, img/decor_br-720.webp 720w" sizes="min(46vw, 270px)" alt="" loading="lazy">
    <img class="sec-orn" data-step="orn" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="200px" alt="" loading="lazy">
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <img class="orn" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="180px" alt="" aria-hidden="true">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
