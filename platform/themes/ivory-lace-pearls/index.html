<!doctype html>
<!-- Ivory Lace & Pearls · page 1 — envelope landing (/<slug>). W1.1 comp: pearly ivory satin with soft diagonal window
     light, a corner of ivory lace, pearl strands and white garden roses top-left and bottom-right, a teardrop pearl drop
     and a rose petal top-right, a satin bow and a petal lower down, "YOU ARE INVITED" in spaced Bodoni capitals, the names
     in a copperplate script, the lace-covered ivory gatefold folder (two doors meeting at a plain centre seam) with the
     pearl clasp fastened over the seam at mid-height, "TAP TO OPEN" over a small strand of pearls. Opening (catalogue,
     docs/11 §7.4 gatefold): on tap the pearl clasp unhooks and slips away, the lace-covered doors part slowly to the sides
     like a lifted veil, and the card rises from the satin centre while a strand of tiny pearls glints; the card comes
     forward and flies to home (view transition). Personal text: none — [data-field] / [data-text] / [data-photo] are
     filled on the server (platform/README.md). Thank-you mode (G075, data-if="thank_you_on"): the same folder and
     opening; the card carries the couple's thank-you title and the date, its window the thank-you photo or — without
     one — the ivory satin and the pearl clasp (never a photo placeholder). Design texts: data-copy (G068, theme.json
     "copy"). Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#F1E7DE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&amp;family=Mrs+Saint+Delafield&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:73.6%;ascent-override:123.6%;descent-override:84.2%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:63.3%;ascent-override:143.8%;descent-override:98%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<style>.js:not(.parts-on) img[data-defer]{display:none!important}</style>
<script>/* deferred opening parts (G180, docs/11 §6): the images that only show after the tap ([data-defer], lazy) wait until the
   closed object's own high-priority image(s) in .stage have loaded and painted, then all load at once (eager: a lazy part clipped by its card would
   wait for the animation) — before the tap, so the opening never waits */
(function(d,r){var on=function(){r.classList.add('parts-on');[].forEach.call(d.querySelectorAll('img[data-defer]'),function(i){i.loading='eager'})};if(r.classList.contains('is-opened')){on();return d.addEventListener('DOMContentLoaded',on)}addEventListener('pointerdown',on,true);addEventListener('keydown',on,true);addEventListener('load',on);d.addEventListener('DOMContentLoaded',function(){var h=d.querySelectorAll('.stage img[fetchpriority=high]');h=h.length?h:d.querySelectorAll('img[fetchpriority=high]');var n=h.length,one=function(){--n||requestAnimationFrame(function(){setTimeout(on)})};if(!n)on();h.forEach(function(i){i.complete?one():(i.addEventListener('load',one),i.addEventListener('error',one))})})})(document,document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the satin with its diagonal window light (bg_page's flower-free middle), the two GPT corner clusters
     as separate layers (whole on screen) and the comp's small pieces: the pearl drop and a petal top-right, the satin bow
     and a petal lower down -->
<div class="scene-bg" aria-hidden="true">
  <img class="corner corner-tl" src="img/decor_tl-320.webp" srcset="img/decor_tl-320.webp 320w, img/decor_tl-480.webp 480w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(26vw, 42vh, 360px), min(40vw, 22svh, 230px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-320.webp" srcset="img/decor_br-320.webp 320w, img/decor_br-480.webp 480w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(26vw, 42vh, 360px), min(42vw, 22svh, 240px)" alt="">
  <img class="float f-drop" src="img/accent_1-96.webp" alt="">
  <img class="float f-petal" src="img/accent_2-200.webp" alt="">
  <img class="float f-bow" src="img/accent_3-200.webp" alt="">
  <img class="float f-petal2" src="img/accent_2-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <!-- layers bottom → top (docs/11 §7.2 kapi): door insides · satin centre panel · card · lace pocket · doors · clasp -->
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="door-l-in" src="img/door_l_in-240.webp" srcset="img/door_l_in-240.webp 240w, img/door_l_in-366.webp 366w" sizes="min(40vw, 17.5svh, 205px)" alt="">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="door-r-in" src="img/door_r_in-240.webp" srcset="img/door_r_in-240.webp 240w, img/door_r_in-370.webp 370w" sizes="min(40vw, 17.5svh, 205px)" alt="">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="center" src="img/center-320.webp" srcset="img/center-320.webp 320w, img/center-715.webp 715w" sizes="min(78vw, 34svh, 400px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(38vw, 16.5svh, 195px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/accent_2-200.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same window, else the ivory satin and the pearl clasp (decoration) -->
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(38vw, 16.5svh, 195px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(26vw, 11svh, 130px)" alt=""></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(63vw, 27.5svh, 320px)" alt="">
          <div class="card-copy">
            <p class="script card-line" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
          </div>
        </div>
      </div>
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="pocket" src="img/pocket-320.webp" srcset="img/pocket-320.webp 320w, img/pocket-713.webp 713w" sizes="min(78vw, 34svh, 400px)" alt="">
      <img class="door-l" src="img/door_l-240.webp" srcset="img/door_l-240.webp 240w, img/door_l-358.webp 358w" sizes="min(39vw, 17svh, 200px)" alt="" fetchpriority="high">
      <img class="door-r" src="img/door_r-240.webp" srcset="img/door_r-240.webp 240w, img/door_r-358.webp 358w" sizes="min(39vw, 17svh, 200px)" alt="" fetchpriority="high">
    </div>
    <!-- the pearl clasp: its own layer on the seam (outside .env: the stage's fit to the open folder does not move it) —
         it unhooks and slips away before the doors part -->
    <div class="closure"><img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(21vw, 9svh, 106px)" alt=""></div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>
  <!-- "a strand of tiny pearls glints" (MOTION.envelope.glint): the GPT strand under the hint, a borderless light masked to it -->
  <span class="hint-orn" aria-hidden="true"><img src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="170px" alt=""><i class="glint-band"></i></span>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
