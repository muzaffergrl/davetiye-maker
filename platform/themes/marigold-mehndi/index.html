<!doctype html>
<!-- Marigold & Mehndi · page 1 — the closed envelope (/<slug>). On fuchsia velvet "Together with their families", "invite
     you to celebrate", the names in Rozha One; in the middle a fuchsia silk envelope held in a gold laser-cut paisley
     sleeve with a silk tassel; below, the date · city and "Tap to open"; Skip in the corner (the catalogue cover's
     order, K23 strict). Opening (docs/24 row 33, site.js MOTION.envelope): on tap the tassel swings like a pendulum, the
     sleeve slides off to the side, light runs over the silk, the straight silk flap turns up on its top edge and hands
     over to its velvet inner face, the velvet-fuchsia lining warms, marigold petals drift down (GPT sprites), the diya
     flames under the envelope light one by one (GPT), then the card with the arched portrait, "Our wedding", the names
     and the date rises out of the lining, comes forward and flies to home (view transition invite-card → the home hero
     card). Envelope back, lining, card, pocket front, flap (two faces), sleeve, tassel, light, petals and diyas are
     separate layers; nothing is one picture that fades, and nothing is a V flap or a wax seal. Silk, velvet, gold and
     paper are GPT pixels cut and toned by build_images.py (interim until the PAKET 5 parts, GPT_PROMPTS.md). Personal
     text: none — [data-field] / [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same
     opening; the card carries the thank-you title and the date, its window the thank-you photo or — without one — the
     velvet lining. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3e0726">
<title data-text="{name_display} · {copy.envelope_kicker}">Marigold &amp; Mehndi</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yrsa:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <!-- the marigold garland along the top of the velvet (GPT W2.8; hidden until it exists) -->
  <span class="garland garland-top" aria-hidden="true"></span>
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Together with their families</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <p class="invite-line" data-if="!thank_you_on" data-copy="envelope_invite">invite you to celebrate</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the envelope" data-copy-attr="aria-label:envelope_open">
    <div class="parcel">
      <!-- the velvet inner face of the flap: stands up above the envelope once the silk front has turned to its edge -->
      <span class="flap-in"></span>
      <!-- the silk back of the envelope and its velvet-fuchsia lining (seen when the flap is open) -->
      <span class="env-back"></span>
      <span class="lining"></span>
      <!-- the card that rises out of the lining (interim: saffron-ivory paper toned from GPT texture; card_small with
           an arched #00FF00 window replaces it, GPT_PROMPTS.md W2.10) -->
      <div class="card" aria-hidden="true">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_arch-640.webp" sizes="min(34vw, 190px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_arch-640.webp" sizes="min(34vw, 190px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/velvet-640.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the pocket front, the straight silk flap (front face), the gold sleeve with its tassel, the light on the silk -->
      <span class="env-front"></span>
      <span class="flap"></span>
      <span class="sleeve"><span class="sleeve-gold"></span><span class="tassel"></span></span>
      <span class="sheen"></span>
    </div>
  </div>
  <!-- the brass diyas under the envelope, their flames lit one by one (GPT W2.6/W2.7; hidden until they exist) -->
  <div class="diyas" aria-hidden="true">
    <span class="diya"><span class="flame"></span></span>
    <span class="diya"><span class="flame"></span></span>
    <span class="diya"><span class="flame"></span></span>
    <span class="diya"><span class="flame"></span></span>
    <span class="diya"><span class="flame"></span></span>
  </div>
  <div class="opening-foot">
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
    <div class="opening-actions">
      <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
      <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
      <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
    </div>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the envelope</span></a></p>
</main>
</body>
</html>
