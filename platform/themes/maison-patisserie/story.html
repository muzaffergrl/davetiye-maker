<!doctype html>
<!-- Maison Pâtisserie · page 3 — story (/<slug>/story). Redesign of 2026-10-22 (docs/35, G428). On cream pinstriped
     pastry paper the kicker, "Our Story" (a soft gold shimmer passes over it once) and the intro; below, the display
     case: three gold-rimmed porcelain cake plates stand on a glass shelf with gold brackets — drag, swipe, the arrows or
     the keys slide them along it, the plate in the middle steps forward with a slight turn and settles; with reduced
     motion it is a plain scroll-snap row. The caption of the plate in front under the shelf. Personal text: none —
     filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf5ec">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Parisienne&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:85.4%;ascent-override:99.5%;descent-override:46.8%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:73.4%;ascent-override:115.7%;descent-override:54.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Sweet moments</p>
    <h1 class="foil" data-copy="story_title" data-step="title">Our Story</h1>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <section class="showcase" aria-roledescription="carousel" aria-label="Photographs" data-copy-attr="aria-label:album_label" data-scene="story-shelf">
    <div class="display-case" data-step="shelf">
      <div class="vitrine-track" data-carousel tabindex="0">
        <figure class="plate-item" data-step="plate" data-i="0">
          <span class="frame plate plate-photo">
            <span class="photo-slot" data-slot="story_1">
              <img data-photo="story_1" src="img/ph_round-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(58vw, 280px)" fetchpriority="high">
              <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
            </span>
            <span class="cut" aria-hidden="true"></span>
          </span>
          <figcaption><span class="num" aria-hidden="true">01</span> <span data-field="story.items.0.caption"></span></figcaption>
        </figure>
        <figure class="plate-item" data-step="plate" data-i="1">
          <span class="frame plate plate-photo">
            <span class="photo-slot" data-slot="story_2">
              <img data-photo="story_2" src="img/ph_round-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(58vw, 280px)" loading="lazy">
              <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
            </span>
            <span class="cut" aria-hidden="true"></span>
          </span>
          <figcaption><span class="num" aria-hidden="true">02</span> <span data-field="story.items.1.caption"></span></figcaption>
        </figure>
        <figure class="plate-item" data-step="plate" data-i="2">
          <span class="frame plate plate-photo">
            <span class="photo-slot" data-slot="story_3">
              <img data-photo="story_3" src="img/ph_round-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(58vw, 280px)" loading="lazy">
              <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
            </span>
            <span class="cut" aria-hidden="true"></span>
          </span>
          <figcaption><span class="num" aria-hidden="true">03</span> <span data-field="story.items.2.caption"></span></figcaption>
        </figure>
      </div>
      <span class="shelf" aria-hidden="true"></span>
    </div>
    <div class="carousel-controls" data-step="controls">
      <button type="button" data-carousel-prev data-copy-attr="aria-label:album_previous" aria-label="Previous photograph">←</button>
      <span class="carousel-count" data-carousel-count aria-live="polite"></span>
      <button type="button" data-carousel-next data-copy-attr="aria-label:album_next" aria-label="Next photograph">→</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
  </section>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
