<!doctype html>
<!-- Orient Express Voyage · page 1 — the closed ticket wallet (/<slug>). A station at night, "ALL ABOARD", the names in
     Limelight, a bottle-green leather ticket wallet held shut by a strap with a brass buckle, "TAP TO UNBUCKLE".
     Opening (own type "cuzdan", docs/11 §7; MOTION.envelope in site.js): on tap the strap unbuckles — the buckle end
     slides away to the right, the tail to the left —, the cover swings open on its left hinge (its inside, a separate
     part, takes over past 90°) while the stage settles the two-wallet-wide spread on screen, the first-class ticket — the
     portrait, "First class to forever", the names, the date — slides up out of the pocket, comes forward and travels to
     home (view transition invite-card → the home ticket block). Strap halves, cover, inside cover, inside panel, pocket
     lip and ticket are separate layers (build_images.py; interim tones until the PAKET 5 parts, GPT_PROMPTS.md).
     Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the
     same opening; the ticket carries the thank-you title and the date, its window the thank-you photo or — without one —
     the boarding stamp. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11241b">
<title data-text="{name_display} · {copy.envelope_kicker}">Orient Express Voyage</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="All aboard">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Board" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<img class="station-bg" src="img/station_bg-640.webp" srcset="img/station_bg-640.webp 640w, img/station_bg-1024.webp 1024w" sizes="(min-aspect-ratio: 2/3) 100vw, 150svh" alt="" fetchpriority="high">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">All aboard</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <!-- manifest stage: the wallet box (640 × 960 of the 1024 × 1536 canvas); every piece is placed in % of it -->
    <div class="wallet">
      <img class="w-inside" src="img/wallet_inside-440.webp" srcset="img/wallet_inside-440.webp 440w, img/wallet_inside-640.webp 640w" sizes="min(64vw, 330px)" alt="">
      <div class="ticket" aria-hidden="true">
        <div class="ticket-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(36vw, 190px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(36vw, 190px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/stamp-240.webp" alt=""></span>
        </div>
        <img class="ticket-img" src="img/ticket-480.webp" srcset="img/ticket-480.webp 480w, img/ticket-640.webp 640w" sizes="min(50vw, 260px)" alt="">
        <div class="ticket-copy">
          <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">First class to forever</p>
          <p class="ticket-names" data-if="!thank_you_on" data-field="name_display"></p>
          <p class="ticket-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
          <p class="eyebrow ticket-date" data-field="date"></p>
        </div>
      </div>
      <img class="w-pocket" src="img/wallet_pocket-440.webp" srcset="img/wallet_pocket-440.webp 440w, img/wallet_pocket-640.webp 640w" sizes="min(64vw, 330px)" alt="">
      <div class="w-cover">
        <img class="w-cover-front" src="img/wallet_cover-440.webp" srcset="img/wallet_cover-440.webp 440w, img/wallet_cover-640.webp 640w" sizes="min(64vw, 330px)" alt="" fetchpriority="high">
        <img class="w-cover-in" src="img/wallet_cover_in-440.webp" srcset="img/wallet_cover_in-440.webp 440w, img/wallet_cover_in-640.webp 640w" sizes="min(64vw, 330px)" alt="">
      </div>
      <img class="strap-l" src="img/strap_l-240.webp" srcset="img/strap_l-240.webp 240w, img/strap_l-480.webp 480w" sizes="min(40vw, 205px)" alt="">
      <img class="strap-r" src="img/strap_r-160.webp" srcset="img/strap_r-160.webp 160w, img/strap_r-320.webp 320w" sizes="min(25vw, 126px)" alt="">
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to unbuckle</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Board</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
