<!doctype html>
<!-- Highland Tartan & Thistle · page 1 — the closed envelope (/<slug>). Over the misty hills "Together with their
     families", "invite you to celebrate" and the names in Rouge Script; in the middle a tartan wool envelope with a
     straight flap, held shut by a leather strap through a brass buckle; below it the date · place and "Tap to open".
     Opening (docs/24 row 35, site.js MOTION.envelope): on tap the buckle's frame tips open and lets the prong go, the
     strap slides up out of it and off the envelope, the wool flap swings up on its top fold, a sprig of heather and the
     card rise out of the pocket while the mist over the hills draws off to both sides; the card comes forward and flies
     to home (view transition invite-card → the home hero card). Back of the envelope, front pocket, flap, strap, buckle,
     card, sprig and the two banks of mist are separate layers; the wool, leather, brass and paper are GPT pixels cut and
     toned by build_images.py (interim until the PAKET 5 parts, GPT_PROMPTS.md). Personal text: none — [data-field] /
     [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the card carries the
     thank-you title and the date, its locket the thank-you photo or — without one — the wool. Design texts: data-copy
     (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20291d">
<title data-text="{name_display} · {copy.envelope_kicker}">Highland Tartan &amp; Thistle</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rouge+Script&family=Sorts+Mill+Goudy:ital@0;1&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <!-- the hills (GPT oil-painted landscape, W2.4; hidden until it exists) and the two banks of mist that draw off -->
  <span class="hills" aria-hidden="true"></span>
  <span class="mist m-far" aria-hidden="true"></span>
  <span class="mist m-near" aria-hidden="true"></span>
  <div class="opening-heading">
    <p class="eyebrow host" data-if="host_line !thank_you_on" data-field="host_line"></p>
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Invite you to celebrate</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the envelope" data-copy-attr="aria-label:envelope_open">
    <div class="satchel">
      <!-- inside of the envelope (seen when the flap is up), the heather sprig and the card in the pocket -->
      <span class="env-back"></span>
      <span class="sprig" aria-hidden="true"></span>
      <div class="card" aria-hidden="true">
        <div class="card-photo locket-face photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_oval-640.webp" sizes="min(34vw, 170px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_oval-640.webp" sizes="min(34vw, 170px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/wool-640.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the front pocket, the straight flap on its top fold, the leather strap with the brass buckle -->
      <span class="env-front"></span>
      <span class="flap"><span class="flap-in"></span></span>
      <span class="strap"><span class="buckle"></span></span>
      <!-- daylight passing over the wool (light only, docs/11 §5.7) -->
      <span class="sheen"></span>
    </div>
  </div>
  <div class="opening-foot">
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
  </div>
  <div class="opening-actions">
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the envelope</span></a></p>
</main>
</body>
</html>
