<!doctype html>
<!-- Celestial Observatory · page 1 — the closed observatory (/<slug>). On the midnight sky "You are invited", the names
     in Imperial Script, the date and the city; below them the brass observatory, its slit shutter closed, "Tap to open".
     Opening (docs/24 row 29, site.js MOTION.envelope): on tap moonlight passes over the brass, the two halves of the
     slit shutter part and the night sky shows in the slit, a soft light rises from it, stars light up one by one over
     the observatory and a fine constellation line joins them into the couple's initials (a UI line drawn by site.js on
     a canvas from data-field="initials"; the stars are GPT sprites when they exist), the engraved sky turns, then the
     card with the round portrait, "Our wedding", the names and the date rises out of the slit, comes forward and flies
     to home (view transition invite-card → the home hero card). Dome, slit sky, shutter halves, light, card and the
     constellation are separate layers; the brass and the sky are GPT pixels cut and toned by build_images.py (interim
     until the PAKET 5 parts, GPT_PROMPTS.md). Personal text: none — [data-field] / [data-text] / [data-photo] are filled
     on the server. Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its
     window the thank-you photo or — without one — the night sky. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title data-text="{name_display} · {copy.envelope_kicker}">Celestial Observatory</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Imperial+Script&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <!-- the engraved sky that turns during the opening (GPT star_chart, W2.6; empty until it exists) -->
  <span class="sky-chart" aria-hidden="true"></span>
  <div class="sky-band">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <!-- the constellation of the couple's initials: site.js joins the stars with a fine line on the canvas (the letters
       are read from the monogram the platform wrote here; the monogram itself is never shown) -->
  <div class="constellation" aria-hidden="true"><canvas></canvas><span class="mono" data-field="initials"></span></div>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the dome" data-copy-attr="aria-label:envelope_open">
    <div class="observatory">
      <!-- the card that rises out of the slit (interim: chart paper toned from GPT texture; card_small with a round
           #00FF00 window replaces it, GPT_PROMPTS.md W2.11) -->
      <div class="card" aria-hidden="true">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_round-640.webp" sizes="min(36vw, 200px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_round-640.webp" sizes="min(36vw, 200px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/sky-640.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the night sky in the slit, the light that rises from it, the dome round the slit, the two shutter halves -->
      <span class="slit"><span class="slit-sky"></span><span class="beam"></span></span>
      <span class="dome"></span>
      <span class="slit shutters"><span class="shutter sh-l"></span><span class="shutter sh-r"></span></span>
      <!-- moonlight passing over the brass (light only, docs/11 §5.7) -->
      <span class="sheen"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the dome</span></a></p>
</main>
</body>
</html>
