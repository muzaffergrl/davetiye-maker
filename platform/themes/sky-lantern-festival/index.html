<!doctype html>
<!-- Sky Lantern Festival · page 1 — the lantern in the hands (/<slug>). A dusk sky from deep violet to an amber horizon,
     "UNDER THE EVENING SKY", the names in Corinthia, a rice-paper lantern held in cupped hands, unlit, "TAP TO OPEN".
     Opening (docs/24 row 31 — a lantern lift-off): the lantern kindles and its warm halo blooms, the hands open and sink
     away, the lantern rises up and out of the screen with a slow sway while the sky and the star dust slide down behind
     it at their own speeds (parallax) and three distant lanterns rise past; in the light it leaves, the rice-paper card —
     your portrait, "Our wedding", the names, the date — glows into view and comes forward to home (view transition
     invite-card → the home card). Sky, stars, distant lanterns, hands, lantern (dark + lit), halo and card are separate
     layers. Interim pieces (build_images.py) until the PAKET 5 parts (GPT_PROMPTS.md). Personal text: none —
     [data-field] / [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the
     card carries the thank-you title and the date, its window the thank-you photo or — without one — a distant lantern
     of the design. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1f45">
<title data-text="{name_display} · {copy.envelope_kicker}">Sky Lantern Festival</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="Under the evening sky">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corinthia&family=Gilda+Display&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<!-- the dusk: parallax layers behind everything (sky, star dust, three distant lanterns that rise during the opening) -->
<div class="dusk" aria-hidden="true">
  <img class="dusk-sky" src="img/sky-540.webp" srcset="img/sky-540.webp 540w, img/sky-1080.webp 1080w" sizes="100vw" alt="" fetchpriority="high">
  <span class="stars"></span>
  <img class="far far-1" src="img/lantern_far-72.webp" srcset="img/lantern_far-72.webp 72w, img/lantern_far-144.webp 144w" sizes="30px" alt="">
  <img class="far far-2" src="img/lantern_far-72.webp" srcset="img/lantern_far-72.webp 72w, img/lantern_far-144.webp 144w" sizes="30px" alt="">
  <img class="far far-3" src="img/lantern_far-72.webp" srcset="img/lantern_far-72.webp 72w, img/lantern_far-144.webp 144w" sizes="30px" alt="">
</div>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Under the evening sky</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span><span class="amp">&amp;</span><span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <!-- the card that glows into view in the light the lantern leaves behind -->
    <div class="card" aria-hidden="true">
      <img class="card-img" src="img/card_paper-480.webp" srcset="img/card_paper-480.webp 480w, img/card_paper-878.webp 878w" sizes="min(44vw, calc(30svh * .7), 220px)" alt="">
      <div class="card-copy">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(24vw, 120px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(24vw, 120px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/lantern_far-72.webp" alt=""></span>
        </div>
        <p class="eyebrow" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
    </div>
    <!-- the lantern (dark and lit on the same canvas) and its halo rise together; the hands stay and sink away -->
    <div class="lantern">
      <span class="halo" aria-hidden="true"></span>
      <img class="lantern-dark" src="img/lantern_dark-400.webp" srcset="img/lantern_dark-400.webp 400w, img/lantern_dark-800.webp 800w" sizes="min(70vw, calc(44svh * .6667), 320px)" alt="" fetchpriority="high">
      <img class="lantern-lit" src="img/lantern_lit-400.webp" srcset="img/lantern_lit-400.webp 400w, img/lantern_lit-800.webp 800w" sizes="min(70vw, calc(44svh * .6667), 320px)" alt="">
    </div>
    <!-- GPT layer (hidden until build_images.py finds hands.png): the cupped hands, in front of the lantern's base -->
    <span class="hands" aria-hidden="true"></span>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
