<!doctype html>
<!-- Enchanted Forest Storybook · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the calligraphic script,
     a small ivy sprig between two hairlines, "MOMENTS WE HOLD DEAR", then a single tall aged-cream storybook page (the same
     page as the details card: GPT info_card, 3-slice, its plain middle tiled — never stretched) with three photo-cornered
     pictures mounted down it in a gentle zigzag — left, right, left — a tiny sprig beside each (GPT fern frond), a caption
     in the script under each, fireflies between them. Catalogue: the pictures appear as the page turns (the page turns
     into place on its left edge, then each picture is pressed onto it, its sprig and caption follow). Phones keep the
     zigzag: each picture 62 % of the page (photo window ≥ 38vw, docs/11 §9), one under another; from 720 px the comp's
     overlapping zigzag. Photo slots story_1..3 (theme.json → media.memory_photos.0..2), captions story.items.0..2.caption.
     The whole page is off (404) when optional_blocks.our_story is false. Kicker / title = design copy (data-copy, G068).
     Thank-you mode (G075): unchanged; with the Day page hidden by the couple the closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#DED8B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Tangerine:wght@700&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-aspect-ratio: 5/4)" srcset="img/mist_wide-1024.webp">
        <img class="scene-img" src="img/mist-580.webp" alt="">
      </picture>
      <img class="corner corner-tl" data-step="decor" data-a="sway-tl" src="img/decor_tl-360.webp" srcset="img/decor_tl-360.webp 360w, img/decor_tl-540.webp 540w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 46vh, 400px), min(54vw, 300px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="sway-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 48vh, 420px), min(50vw, 27svh, 300px)" alt="">
      <img class="float f-fly1" data-step="decor" data-a="glow" src="img/accent_1-200.webp" alt="">
      <img class="float f-fly2" data-step="decor" data-a="glow" src="img/accent_1-200.webp" alt="">
    </div>
    <h1 class="script page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <span class="orn" data-step="kicker" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the storybook page: it turns into place; each picture is its own scene (pressed onto the page, sprig, caption) -->
  <section class="story-sec" data-scene="story-page" data-fold=".p-1" aria-label="Our photos">
    <div class="wrap">
      <div class="paper info story-paper" data-step="page" data-a="turn">
        <img class="paper-top" src="img/info_card-480.webp" srcset="img/info_card-480.webp 480w, img/info_card-860.webp 860w" sizes="min(calc(100vw - 24px), 460px)" alt="">
        <div class="paper-text story-text">
          <figure class="pic p-1" data-scene="story-pic">
            <img class="sprig" data-step="sprig" data-a="fade" src="img/accent_3-100.webp" alt="">
            <div class="frame" data-step="frame" data-a="mount">
              <div class="photo-slot mask-portrait" data-slot="story_1">
                <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 720px) min(17vw, 170px), min(40vw, 190px)" alt="" data-attr-alt="{story.items.0.caption}">
                <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
              </div>
              <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(25vw, 250px), min(58vw, 280px)" alt="">
            </div>
            <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
            <span class="orn" data-step="caption" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
          </figure>
          <figure class="pic p-2" data-scene="story-pic" data-fold>
            <img class="fly fly-1" data-step="sprig" data-a="glow" src="img/accent_1-200.webp" alt="">
            <img class="sprig" data-step="sprig" data-a="fade" src="img/accent_3-100.webp" alt="" loading="lazy">
            <div class="frame" data-step="frame" data-a="mount">
              <div class="photo-slot mask-portrait" data-slot="story_2">
                <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 720px) min(17vw, 170px), min(40vw, 190px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
                <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
              </div>
              <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(25vw, 250px), min(58vw, 280px)" alt="" loading="lazy">
            </div>
            <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
            <span class="orn" data-step="caption" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
          </figure>
          <figure class="pic p-3" data-scene="story-pic" data-fold>
            <img class="fly fly-2" data-step="sprig" data-a="glow" src="img/accent_1-200.webp" alt="" loading="lazy">
            <img class="sprig" data-step="sprig" data-a="fade" src="img/accent_3-100.webp" alt="" loading="lazy">
            <div class="frame" data-step="frame" data-a="mount">
              <div class="photo-slot mask-portrait" data-slot="story_3">
                <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 720px) min(17vw, 170px), min(40vw, 190px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
                <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
              </div>
              <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(25vw, 250px), min(58vw, 280px)" alt="" loading="lazy">
            </div>
            <figcaption class="script" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
            <span class="orn" data-step="caption" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
          </figure>
        </div>
      </div>
    </div>
  </section>

  <section class="section next-sec forest-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="sway-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="min(56vw, 320px)" alt="" loading="lazy">
    <span class="orn" data-step="orn" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
