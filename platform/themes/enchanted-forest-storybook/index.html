<!doctype html>
<!-- Enchanted Forest Storybook · page 1 — the closed storybook (/<slug>). W1.1 comp: a dreamy misty forest with firefly bokeh,
     ivy, foxgloves, ferns and toadstools in the top-left and bottom-right corners, a firefly floating in the mist on either
     side; "YOU ARE INVITED" over a small ivy sprig between two hairlines, the names in a calligraphic script, the antique
     moss-green storybook with its embossed gold border of ferns and mushrooms, the brass leaf clasp hooked over the cover's
     right edge at mid-height, "TAP TO OPEN" over the sprig. Opening (catalogue, docs/11 §7.5 kitap): on tap, the brass
     clasp unhooks and swings away, the moss-green cover swings open to the left like a storybook, the first page turns, and
     the card rises from the page while tiny fireflies glow up around it; the card comes forward and flies to home (view
     transition). Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server
     (platform/README.md). Thank-you mode (G075, data-if="thank_you_on"): the same book and opening; the card carries the
     couple's thank-you title and the date, its window the thank-you photo or — without one — the misty forest and the brass
     clasp (never a photo placeholder). Design texts: data-copy (G068, theme.json "copy"). Visuals: GPT parts only (img/,
     build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#DED8B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Tangerine:wght@700&amp;display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:73.2%;ascent-override:102.4%;descent-override:34.1%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:59.4%;ascent-override:126.4%;descent-override:42.1%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<style>.js:not(.parts-on) img[data-defer]{display:none!important}</style>
<script>/* deferred opening parts (G180, docs/11 §6): the images that only show after the tap ([data-defer], lazy) wait until the
   closed object's own high-priority image(s) in .stage have loaded and painted, then all load at once (eager: a lazy part clipped by its card would
   wait for the animation) — before the tap, so the opening never waits */
(function(d,r){var on=function(){r.classList.add('parts-on');[].forEach.call(d.querySelectorAll('img[data-defer]'),function(i){i.loading='eager'})};if(r.classList.contains('is-opened')){on();return d.addEventListener('DOMContentLoaded',on)}addEventListener('pointerdown',on,true);addEventListener('keydown',on,true);addEventListener('load',on);d.addEventListener('DOMContentLoaded',function(){var h=d.querySelectorAll('.stage img[fetchpriority=high]');h=h.length?h:d.querySelectorAll('img[fetchpriority=high]');var n=h.length,one=function(){--n||requestAnimationFrame(function(){setTimeout(on)})};if(!n)on();h.forEach(function(i){i.complete?one():(i.addEventListener('load',one),i.addEventListener('error',one))})})})(document,document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the misty forest (a cluster-free crop of bg_page; mirrored on wide screens) + the two GPT corner
     clusters as separate layers, each whole on screen; the comp's two floating fireflies -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 5/4)" srcset="img/mist_wide-1024.webp">
    <img class="scene-img" src="img/mist-580.webp" alt="" fetchpriority="high">
  </picture>
  <img class="corner corner-tl" src="img/decor_tl-360.webp" srcset="img/decor_tl-360.webp 360w, img/decor_tl-540.webp 540w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(30vw, 52vh, 460px), min(60vw, 30svh, 330px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(30vw, 52vh, 460px), min(60vw, 30svh, 330px)" alt="">
  <img class="float f-fly1" src="img/accent_1-200.webp" alt="">
  <img class="float f-fly2" src="img/accent_1-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <span class="orn" aria-hidden="true"><img src="img/divider-300.webp" alt=""></span>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <!-- the storybook (docs/11 §7.5): layers bottom → top — the cover's lined inside, the right page, the card lying on the
       first page, the page that turns (front + its mirrored back), the closed cover, the brass clasp -->
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="book-cover-in" src="img/book_cover_in-360.webp" srcset="img/book_cover_in-360.webp 360w, img/book_cover_in-640.webp 640w" sizes="min(84vw, 37svh, 440px)" alt="">
      <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="book-page" src="img/book_page-360.webp" srcset="img/book_page-360.webp 360w, img/book_page-700.webp 700w" sizes="min(84vw, 37svh, 440px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-defer loading="lazy" fetchpriority="low" decoding="async" data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(36vw, 160px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same window, else the misty forest and the brass clasp -->
            <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(36vw, 160px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(26vw, 120px)" alt=""></span>
          </div>
          <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(52vw, 230px)" alt="">
          <div class="card-copy">
            <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
          </div>
        </div>
      </div>
      <div class="book-turn">
        <img data-defer loading="lazy" fetchpriority="low" decoding="async" class="book-leaf" src="img/book_leaf-320.webp" srcset="img/book_leaf-320.webp 320w, img/book_leaf-622.webp 622w" sizes="min(75vw, 33svh, 390px)" alt="">
        <div class="book-leaf-back"><img data-defer loading="lazy" fetchpriority="low" decoding="async" src="img/book_leaf-320.webp" srcset="img/book_leaf-320.webp 320w, img/book_leaf-622.webp 622w" sizes="min(75vw, 33svh, 390px)" alt=""></div>
      </div>
      <img class="book-cover" src="img/book_cover-360.webp" srcset="img/book_cover-360.webp 360w, img/book_cover-640.webp 640w" sizes="min(84vw, 37svh, 440px)" alt="" fetchpriority="high">
      <!-- the brass clasp: its own layer over the cover's right edge — it unhooks and swings away before the cover opens -->
      <div class="closure"><img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(21vw, 9.2svh, 110px)" alt=""></div>
    </div>
  </div>

  <div class="env-hint" aria-hidden="true">
    <p><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>
    <span class="orn"><img src="img/divider-300.webp" alt=""></span>
  </div>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
