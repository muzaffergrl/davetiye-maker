<!doctype html>
<!-- Lavender Provence · page 3 — Our Story (/<slug>/story). W1.3 comp: "Our Story" in the flowing script, "MOMENTS WE
     HOLD DEAR", three deckle-edged pressed-flower cards (photo window framed by pressed lavender sprigs, a caption in
     script on the card) lying at loose angles on the lilac paper — top left, right and lower, bottom left — never
     overlapping; loose lavender buds and tiny white flowers between them, lavender sprays in two corners. Catalogue: the
     cards tumble in at loose angles as if carried by a summer breeze (site.css preset "tumble-l" / "tumble-r": each card
     drifts in from its side, turning, and settles at its own tilt). Phones: one card per row, alternating left / right,
     each card 62vw (photo window 40vw ≥ 38vw, docs/11 §9); from 720 px the comp's two staggered columns; desktop
     (≥ 1024 px landscape) one staggered row. The caption sits on the card's plain paper under the window (site.js
     captions: smaller script, then below the card when it is too long). Photo slots story_1..3 (theme.json →
     media.memory_photos.0..2), captions story.items.0..2.caption. The whole page is off (404) when optional_blocks.our_story
     is false. Kicker / title = design copy (data-copy, G068). Thank-you mode (G075): unchanged; with the Day page hidden by
     the couple the closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#D6CCE5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <img class="corner corner-tl" data-step="decor" data-a="drift-tl" src="img/florals_tl-400.webp" srcset="img/florals_tl-400.webp 400w, img/florals_tl-640.webp 640w, img/florals_tl-820.webp 820w" sizes="(min-aspect-ratio: 3/4) min(30vw, 48vh, 420px), min(50vw, 300px)" alt="">
      <img class="float f-bud1" data-step="decor" data-a="fade" src="img/bud-80.webp" alt="">
      <img class="float f-bud2" data-step="decor" data-a="fade" src="img/bud-80.webp" alt="">
    </div>
    <h1 class="script page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the pressed cards: one scene each, so each one tumbles in as it comes into view (from the left, right, left) -->
  <section class="tiles" aria-label="Our photos">
    <figure class="tile t-1" data-scene="story-tile" data-fold>
      <img class="loose lp-bud" data-step="caption" data-a="fade" src="img/bud-80.webp" alt="">
      <img class="loose lp-daisy" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="">
      <div class="frame" data-step="card" data-a="tumble-l">
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 1024px) min(15.6vw, 221px), (min-width: 720px) 163px, min(40.3vw, 208px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/bud-80.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(24vw, 340px), (min-width: 720px) 250px, min(62vw, 320px)" alt="">
      </div>
      <figcaption class="script cap" data-step="caption" data-a="write" data-field="story.items.0.caption"></figcaption>
    </figure>
    <figure class="tile t-2" data-scene="story-tile" data-fold>
      <img class="loose lp-bud" data-step="caption" data-a="fade" src="img/bud-80.webp" alt="" loading="lazy">
      <img class="loose lp-daisy" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="" loading="lazy">
      <div class="frame" data-step="card" data-a="tumble-r">
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 1024px) min(15.6vw, 221px), (min-width: 720px) 163px, min(40.3vw, 208px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/bud-80.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(24vw, 340px), (min-width: 720px) 250px, min(62vw, 320px)" alt="" loading="lazy">
      </div>
      <figcaption class="script cap" data-step="caption" data-a="write" data-field="story.items.1.caption"></figcaption>
    </figure>
    <figure class="tile t-3" data-scene="story-tile" data-fold>
      <img class="loose lp-bud" data-step="caption" data-a="fade" src="img/bud-80.webp" alt="" loading="lazy">
      <img class="loose lp-daisy" data-step="caption" data-a="fade" src="img/accent_2-200.webp" alt="" loading="lazy">
      <div class="frame" data-step="card" data-a="tumble-l">
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 1024px) min(15.6vw, 221px), (min-width: 720px) 163px, min(40.3vw, 208px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/bud-80.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 1024px) min(24vw, 340px), (min-width: 720px) 250px, min(62vw, 320px)" alt="" loading="lazy">
      </div>
      <figcaption class="script cap" data-step="caption" data-a="write" data-field="story.items.2.caption"></figcaption>
    </figure>
  </section>

  <section class="section next-sec" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="drift-br" src="img/florals_br-400.webp" srcset="img/florals_br-400.webp 400w, img/florals_br-640.webp 640w, img/florals_br-820.webp 820w" sizes="min(54vw, 320px)" alt="" loading="lazy">
    <img class="sprig" data-step="sprig" data-a="unfurl" src="img/divider-300.webp" srcset="img/divider-300.webp 300w, img/divider-600.webp 600w" sizes="170px" alt="" loading="lazy">
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <span class="orn" aria-hidden="true"><img src="img/bud-80.webp" alt=""></span>
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
