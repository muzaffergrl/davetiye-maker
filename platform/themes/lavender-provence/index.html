<!doctype html>
<!-- Lavender Provence · page 1 — envelope landing (/<slug>). W1.1 comp: soft lilac handmade paper, pressed lavender,
     white daisies and wheat in the top-left and bottom-right corners, a few loose lavender buds, "YOU ARE INVITED" in
     spaced capitals, the names in a flowing script, a small cream linen pouch gathered at the neck and tied with jute
     twine around a little lavender bundle, "TAP TO OPEN" over a hairline with a lavender bud. Opening (catalogue,
     docs/11 §7.6 — linen pouch): on tap the jute twine with its lavender bundle unties and slips away, the linen pouch
     loosens and opens, and the card slides up out of it while dried lavender buds scatter on a summer breeze; the card
     comes forward and flies to home (view transition). Personal text: none — [data-field] / [data-text] / [data-photo]
     are filled on the server (platform/README.md). Thank-you mode (G075, data-if="thank_you_on"): the same pouch and
     opening; the card carries the couple's thank-you title and the date, its window the thank-you photo or — without one —
     the lilac paper and the lavender bundle with its twine (never a photo placeholder). Design texts: data-copy (G068).
     Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#D6CCE5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the lilac paper (body) + the two GPT corner bouquets as separate layers, each whole on screen; loose
     lavender buds and a sprig of thyme resting on the paper -->
<div class="scene-bg" aria-hidden="true">
  <img class="corner corner-tl" src="img/florals_tl-400.webp" srcset="img/florals_tl-400.webp 400w, img/florals_tl-640.webp 640w, img/florals_tl-820.webp 820w" sizes="(min-aspect-ratio: 3/4) min(34vw, 54vh, 520px), min(62vw, 31svh, 340px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/florals_br-400.webp" srcset="img/florals_br-400.webp 400w, img/florals_br-640.webp 640w, img/florals_br-820.webp 820w" sizes="(min-aspect-ratio: 3/4) min(34vw, 56vh, 520px), min(58vw, 33svh, 330px)" alt="">
  <img class="float f-bud1" src="img/bud-80.webp" alt="">
  <img class="float f-bud2" src="img/bud-80.webp" alt="">
  <img class="float f-bud3" src="img/bud-80.webp" alt="">
  <img class="float f-bud4" src="img/bud-80.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <!-- the open pouch (back wall + lining, the card, the front wall) — loosens as one -->
      <div class="pouch">
        <img class="pouch-back" src="img/pouch_back-440.webp" srcset="img/pouch_back-440.webp 440w, img/pouch_back-662.webp 662w" sizes="min(67vw, 32svh, 334px)" alt="">
        <div class="card-slot">
          <div class="card" aria-hidden="true">
            <div class="photo-slot mask-card" data-slot="hero_portrait">
              <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(24.5vw, 11.6svh, 124px)" alt="">
              <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img src="img/bud-80.webp" alt=""><span>Your photo here</span></span>
              <!-- thank-you mode: the couple's thank-you photo in the same window, else the lilac paper and the lavender bundle -->
              <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(24.5vw, 11.6svh, 124px)" alt="">
              <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-550.webp 550w" sizes="min(24.5vw, 11.6svh, 124px)" alt=""></span>
            </div>
            <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(38vw, 18svh, 192px)" alt="">
            <div class="card-copy">
              <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
              <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
              <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
            </div>
          </div>
        </div>
        <img class="pouch-front" src="img/pouch_front-440.webp" srcset="img/pouch_front-440.webp 440w, img/pouch_front-662.webp 662w" sizes="min(67vw, 32svh, 334px)" alt="">
      </div>
      <img class="pouch-closed" src="img/pouch_closed-440.webp" srcset="img/pouch_closed-440.webp 440w, img/pouch_closed-662.webp 662w" sizes="min(67vw, 32svh, 334px)" alt="" fetchpriority="high">
      <!-- the twine with its lavender bundle (closure.png, 1:1 on the pouch canvas) in three cuts: the loops slacken apart,
           the bundle with its knot slips away -->
      <img class="tie tie-l" src="img/tie_l-160.webp" srcset="img/tie_l-160.webp 160w, img/tie_l-212.webp 212w" sizes="min(25vw, 12svh, 126px)" alt="">
      <img class="tie tie-r" src="img/tie_r-160.webp" srcset="img/tie_r-160.webp 160w, img/tie_r-249.webp 249w" sizes="min(25vw, 12svh, 126px)" alt="">
      <img class="bundle" src="img/bundle-240.webp" srcset="img/bundle-240.webp 240w, img/bundle-349.webp 349w" sizes="min(36vw, 17svh, 177px)" alt="">
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>
  <span class="orn env-orn" aria-hidden="true"><img src="img/bud-80.webp" alt=""></span>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
