<!doctype html>
<!-- Art Nouveau Lily · page 1 — the closed envelope (/<slug>). On the sage ground, like the catalogue cover: the host line
     ("Together with their families"), "invite you to celebrate" and the names in Ephesis above; the cream envelope in
     the middle — its front closed by three petal flaps (left, right, centre) whose points meet under the stained-glass
     lily medallion; the date · place and "Tap to open" below; Skip in the corner.
     Opening (docs/24 row 37, site.js MOTION.envelope): on tap a band of light sweeps across the envelope and through the
     stained glass, the medallion glows and lifts away, the two side petals open outward on their side hinges and curl
     back, showing their lilac lining, then the centre petal opens upward on its top hinge — the envelope opens like a
     lily — the card with the arched portrait rises out of the pocket, comes forward and flies to home (view transition
     invite-card → the home hero card). Back, pocket, three petals (each a front and a lining face in one 3D wrapper),
     medallion, light and card are separate layers; nothing is one picture that fades. The papers are GPT pixels cut and
     toned by build_images.py (interim until the PAKET 5 parts, GPT_PROMPTS.md). Personal text: none — [data-field] /
     [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the card carries the
     thank-you title and the date, its window the thank-you photo or — without one — the lilac lining. Design texts:
     data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#55634e">
<title data-text="{name_display} · {copy.envelope_kicker}">Art Nouveau Lily</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ephesis&family=Federant&family=Linden+Hill:ital@0;1&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:84.2%;ascent-override:106.9%;descent-override:47.5%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:72.4%;ascent-override:124.3%;descent-override:55.3%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow host" data-if="host_line !thank_you_on" data-field="host_line"></p>
    <p class="eyebrow kicker" data-if="!thank_you_on" data-copy="envelope_kicker">Invite you to celebrate</p>
    <p class="eyebrow kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="envelope">
      <!-- the back of the envelope with its lilac lining (interim: cream and lilac papers toned from GPT textures;
           env_back replaces them, GPT_PROMPTS.md W2.4) -->
      <span class="env-back"><span class="env-lining"></span></span>
      <!-- the card that rises out of the pocket (interim: cream paper; card_small with an arched #00FF00 window
           replaces it, W2.8) -->
      <div class="card" aria-hidden="true">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_arch-640.webp" sizes="min(28vw, 150px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_arch-640.webp" sizes="min(28vw, 150px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/lining-640.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the pocket the card rises from, then the three petal flaps: each turns on its own hinge (left edge, right
           edge, top edge); its front is the cream petal, its back the lilac lining (one 3D wrapper, two faces) -->
      <span class="env-pocket"></span>
      <span class="petal petal-l"><span class="face front"></span><span class="face back"></span></span>
      <span class="petal petal-r"><span class="face front"></span><span class="face back"></span></span>
      <span class="petal petal-c"><span class="face front"></span><span class="face back"></span></span>
      <!-- light through the stained glass (light only, docs/11 §5.7), the medallion (GPT W2.7; none until it exists),
           the band of light that sweeps the envelope -->
      <span class="glass-light"></span>
      <span class="medallion"></span>
      <span class="sheen"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow opening-date"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city_region"></span></p>
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
