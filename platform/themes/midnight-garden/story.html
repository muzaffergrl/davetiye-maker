<!doctype html>
<!-- Midnight Garden · page 3 — Our Story (/<slug>/story). W1.3 comp: "OUR STORY" in high-contrast small capitals,
     "MOMENTS WE HOLD DEAR" in spaced capitals, then three ornate carved gilded baroque frames on the black wall in a
     staggered salon arrangement (first high on the left, second lower on the right, third under the first), a soft warm
     candle glow on the wall behind each, a small-capital caption under each; floral clusters in two corners, the
     butterfly and a petal. Catalogue: the frames light up out of the darkness by candlelight (site.css preset "kindle":
     the glow behind a frame warms first, then the frame and its photo brighten from near-black). Phones: the frames
     stay staggered — one under another, alternately to the left and to the right (frame 64vw, photo window ≥ 38vw,
     docs/11 §9; the comp's two columns would be ~ 25vw); from 720 px the comp's two-column salon. Photo slots story_1..3
     (theme.json → media.memory_photos.0..2), captions story.items.0..2.caption. The whole page is off (404) when
     optional_blocks.our_story is false. Kicker / title = design copy (data-copy, G068). Thank-you mode (G075):
     unchanged; with the Day page hidden by the couple the closing link leads home. -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<meta name="theme-color" content="#0E0D0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Cormorant+SC:wght@500;600&amp;family=Playfair+Display+SC&amp;display=swap">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-long" data-optional="our_story" data-pending="This link will be added soon.">

<main class="site-main">
  <header class="page-head" data-scene="story-head">
    <div class="page-bg" aria-hidden="true">
      <picture>
        <source media="(min-aspect-ratio: 3/4)" srcset="img/night_wide-720.webp">
        <img class="scene-img" src="img/night-690.webp" alt="">
      </picture>
      <img class="corner corner-tl" data-step="decor" data-a="sway-tl" src="img/florals_tl-360.webp" srcset="img/florals_tl-360.webp 360w, img/florals_tl-540.webp 540w, img/florals_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 46vh, 400px), min(52vw, 300px)" alt="">
      <img class="corner corner-br" data-step="decor" data-a="sway-br" src="img/florals_br-360.webp" srcset="img/florals_br-360.webp 360w, img/florals_br-540.webp 540w, img/florals_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 48vh, 420px), min(50vw, 27svh, 300px)" alt="">
      <img class="float f-butterfly" data-step="decor" data-a="fade" src="img/accent_3-200.webp" alt="">
      <img class="float f-petal" data-step="decor" data-a="fade" src="img/accent_1-200.webp" alt="">
      <img class="float f-plum" data-step="decor" data-a="fade" src="img/accent_2-200.webp" alt="">
    </div>
    <h1 class="disp page-title" data-step="title" data-a="write" data-copy="story_title">Our Story</h1>
    <p class="kicker" data-step="kicker" data-a="fade" data-fold data-copy="story_kicker">Moments we hold dear</p>
    <p class="lede" data-step="lede" data-a="fade" data-if="story.intro" data-fold><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>

  <!-- the salon: one scene per frame — the candle behind it warms, then the frame lights up out of the dark -->
  <section class="salon" aria-label="Our photos">
    <figure class="pane p-1" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="kindle">
        <span class="glow" aria-hidden="true"></span>
        <div class="photo-slot mask-portrait" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story_1-320.webp" srcset="img/ph_story_1-320.webp 320w, img/ph_story_1-640.webp 640w" sizes="(min-width: 720px) min(18.7vw, 205px), min(41.2vw, 205px)" alt="" data-attr-alt="{story.items.0.caption}">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(29vw, 320px), min(64vw, 320px)" alt="">
      </div>
      <figcaption class="kicker" data-step="caption" data-a="fade" data-field="story.items.0.caption"></figcaption>
    </figure>
    <figure class="pane p-2" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="kindle">
        <span class="glow" aria-hidden="true"></span>
        <div class="photo-slot mask-portrait" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story_2-320.webp" srcset="img/ph_story_2-320.webp 320w, img/ph_story_2-640.webp 640w" sizes="(min-width: 720px) min(18.7vw, 205px), min(41.2vw, 205px)" alt="" data-attr-alt="{story.items.1.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(29vw, 320px), min(64vw, 320px)" alt="" loading="lazy">
      </div>
      <figcaption class="kicker" data-step="caption" data-a="fade" data-field="story.items.1.caption"></figcaption>
    </figure>
    <figure class="pane p-3" data-scene="story-frame" data-fold>
      <div class="frame" data-step="frame" data-a="kindle">
        <span class="glow" aria-hidden="true"></span>
        <div class="photo-slot mask-portrait" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story_3-320.webp" srcset="img/ph_story_3-320.webp 320w, img/ph_story_3-640.webp 640w" sizes="(min-width: 720px) min(18.7vw, 205px), min(41.2vw, 205px)" alt="" data-attr-alt="{story.items.2.caption}" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
        </div>
        <img class="frame-img" src="img/frame_portrait-320.webp" srcset="img/frame_portrait-320.webp 320w, img/frame_portrait-640.webp 640w" sizes="(min-width: 720px) min(29vw, 320px), min(64vw, 320px)" alt="" loading="lazy">
      </div>
      <figcaption class="kicker" data-step="caption" data-a="fade" data-field="story.items.2.caption"></figcaption>
    </figure>
  </section>

  <section class="section next-sec night-end" data-scene="story-next" data-fold>
    <img class="corner corner-br page-corner" data-step="decor" data-a="sway-br" src="img/florals_br-360.webp" srcset="img/florals_br-360.webp 360w, img/florals_br-540.webp 540w, img/florals_br-720.webp 720w" sizes="min(54vw, 320px)" alt="" loading="lazy">
    <span class="orn" data-step="orn" data-a="unfurl" aria-hidden="true"><img src="img/divider-300.webp" alt="" loading="lazy"></span>
    <a class="btn btn-ghost" href="details.html" data-step="link" data-a="rise" data-if="!thank_you_hides_details"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a>
    <!-- thank-you mode with the Day page hidden (G075): back home instead of a link to a closed page -->
    <a class="btn btn-ghost" href="home.html" data-step="link" data-a="rise" data-if="thank_you_hides_details"><span data-copy="home_link">Home</span> <span aria-hidden="true">→</span></a>
  </section>
</main>

<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
