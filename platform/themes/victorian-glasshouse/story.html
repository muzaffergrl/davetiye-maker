<!doctype html>
<!-- Victorian Glasshouse · page 3 — story (/<slug>/story). Three moments down the misted glass page, set left, right,
     left, each one a specimen under glass: a glass case (GPT, W3.12) round a 4:5 photo, a copper label hanging from
     the case on its cord with the moment's number, and below it a herbarium label (GPT, W3.13) with the caption. As
     each scene scrolls into view the mist on its pane is wiped away from one side (a soft-edged mask), a band of
     light crosses the glass, the copper label swings on its cord and settles, then the caption is written onto its
     label; the iron arches behind the page drift at their own pace as it scrolls. Personal text: none — the intro,
     captions and photos are filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3328">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<span class="arches page-arches" aria-hidden="true"></span>
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments we hold dear</p>
    <h1 data-copy="story_title" data-step="title">Our Story</h1>
    <span class="sprig" aria-hidden="true" data-step="title" data-i="1"></span>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <figure class="moment m-1" data-scene="story-frame">
    <div class="specimen moment-photo" data-step="photo">
      <span class="case" aria-hidden="true"></span>
      <div class="pane">
        <div class="photo-slot" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_tall-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(64vw, 340px)" fetchpriority="high">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </div>
        <span class="fog" aria-hidden="true"></span><span class="glint" aria-hidden="true"></span>
      </div>
      <span class="tag swing" aria-hidden="true"><span class="tag-cord"></span><span class="tag-plate"><span class="tag-num">01</span></span></span>
    </div>
    <figcaption class="hlabel" data-step="caption"><span data-field="story.items.0.caption"></span></figcaption>
  </figure>
  <figure class="moment m-2" data-scene="story-frame">
    <div class="specimen moment-photo" data-step="photo">
      <span class="case" aria-hidden="true"></span>
      <div class="pane">
        <div class="photo-slot" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_tall-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(58vw, 310px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </div>
        <span class="fog" aria-hidden="true"></span><span class="glint" aria-hidden="true"></span>
      </div>
      <span class="tag swing" aria-hidden="true"><span class="tag-cord"></span><span class="tag-plate"><span class="tag-num">02</span></span></span>
    </div>
    <figcaption class="hlabel" data-step="caption"><span data-field="story.items.1.caption"></span></figcaption>
  </figure>
  <figure class="moment m-3" data-scene="story-frame">
    <div class="specimen moment-photo" data-step="photo">
      <span class="case" aria-hidden="true"></span>
      <div class="pane">
        <div class="photo-slot" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_tall-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(64vw, 340px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </div>
        <span class="fog" aria-hidden="true"></span><span class="glint" aria-hidden="true"></span>
      </div>
      <span class="tag swing" aria-hidden="true"><span class="tag-cord"></span><span class="tag-plate"><span class="tag-num">03</span></span></span>
    </div>
    <figcaption class="hlabel" data-step="caption"><span data-field="story.items.2.caption"></span></figcaption>
  </figure>
  <footer class="signature" data-scene="story-next">
    <p class="sig-names" data-field="name_display" data-step="names"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
