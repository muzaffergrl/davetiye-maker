<!doctype html>
<!-- Coastal Seaside · page 1 — envelope landing (/<slug>). W1.1 comp: a soft sea-mist watercolor ground; a beach corner
     (dune grass, a moon-snail shell, coral, sea glass, sand and foam) at the top-left, the shoreline wave, sand, sea glass
     and a big scallop shell at the bottom-right; a piece of sea glass and a starfish floating at the top-right;
     "YOU ARE INVITED", the names in a breezy script, the speckled sand envelope with its wave-cut V flap and the scallop
     shell on a loop of twine on the tip, "TAP TO OPEN". Opening (catalogue, docs/11 §7.3): on tap, the watercolor wave
     (wave.png) sweeps across the screen and carries the seashell and twine away, the wave-edged flap lifts, and the card
     rises like the incoming tide; the card comes forward and flies to home (view transition). Personal text: none —
     [data-field] / [data-text] / [data-photo] are filled on the server (platform/README.md). Thank-you mode (G075,
     data-if="thank_you_on"): the same envelope and opening; the card carries the couple's thank-you title and the date,
     its porthole the thank-you photo or — without one — the sea mist and the shell on its twine (never a photo
     placeholder). Design texts: data-copy (G068, theme.json "copy"). Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#D8EEF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allison&amp;family=Lora:ital,wght@0,400;0,600;1,400&amp;display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): the sea mist + the shoreline as its own bottom band (cluster-free crops of bg_page, never under text) + the two GPT beach corners as
     separate layers, each whole on screen; the comp's sea glass and starfish floating at the top-right -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/sea_wide-640.webp">
    <img class="scene-img" src="img/mist-570.webp" alt="" fetchpriority="high">
  </picture>
  <img class="shore-band" src="img/shore-690.webp" alt="">
  <img class="corner corner-tl" src="img/decor_tl-360.webp" srcset="img/decor_tl-360.webp 360w, img/decor_tl-540.webp 540w, img/decor_tl-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(30vw, 50vh, 460px), min(58vw, 30svh, 330px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-360.webp" srcset="img/decor_br-360.webp 360w, img/decor_br-540.webp 540w, img/decor_br-720.webp 720w" sizes="(min-aspect-ratio: 3/4) min(28vw, 50vh, 440px), min(54vw, 28svh, 300px)" alt="">
  <img class="float f-glass" src="img/accent_2-200.webp" alt="">
  <img class="float f-star" src="img/accent_3-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-873.webp 873w" sizes="min(84vw, 440px)" alt="">
      <img class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-873.webp 873w" sizes="min(84vw, 440px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(27vw, 142px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img src="img/accent_1-200.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same porthole, else the sea mist and the shell (decoration) -->
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(27vw, 142px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(22vw, 116px)" alt=""></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(44vw, 233px)" alt="">
          <div class="card-copy">
            <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker"><span class="nowrap" data-field="date"></span><span class="sep" aria-hidden="true" data-if="!thank_you_on"> · </span><span class="cc-city" data-if="!thank_you_on" data-field="venue.city"></span></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-873.webp 873w" sizes="min(84vw, 440px)" alt="">
      <img class="env-closed" src="img/env_closed-440.webp" srcset="img/env_closed-440.webp 440w, img/env_closed-873.webp 873w" sizes="min(84vw, 440px)" alt="" fetchpriority="high">
      <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-873.webp 873w" sizes="min(84vw, 440px)" alt="">
      <!-- the scallop shell on its twine: its own layer on the flap's tip — the wave carries it away before the flap lifts -->
      <!-- the opening wave (GPT wave.png): hidden until the tap, then it sweeps across the screen and takes the shell with it -->
      <img class="env-wave" src="img/wave-640.webp" srcset="img/wave-640.webp 640w, img/wave-1200.webp 1200w" sizes="min(max(150vw, 620px), 1700px)" alt="" decoding="async">
      <div class="closure"><img src="img/closure-240.webp" srcset="img/closure-240.webp 240w, img/closure-480.webp 480w" sizes="min(29vw, 152px)" alt=""></div>
    </div>
  </div>

  <div class="env-hint" aria-hidden="true">
    <p><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>
    <span class="orn"><img src="img/divider-300.webp" alt=""></span>
  </div>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
