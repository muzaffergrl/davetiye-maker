<!doctype html>
<!-- Azulejo Mosaic · page 3 — story (/<slug>/story). Redesign of 2026-10-22 (docs/35 row 30, G430). On sunlit whitewash
     the kicker, "Our Story" and the intro; then three moments, left – right – left, each photo in an azulejo-bordered
     frame: as it scrolls in, the photo is uncovered tile by tile (small painted tiles turn over in a diagonal wave and
     carry the photo's pieces into place), then its caption is written in Arizonia beside the number. A frieze of five
     tiles, the names and the way on. Personal text: none — filled on the server. Design texts: data-copy (G068). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ede3">
<title data-text="{copy.story_title} · {name_display}">Our Story</title>
<meta name="description" data-attr-content="{copy.story_title} · {name_display} · {date|date-long}" content="Our Story">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{copy.story_title} · {name_display}" content="Our Story">
<meta property="og:description" data-attr-content="{date|date-long} · {venue.city_region}" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arizonia&family=Cormorant+Upright:wght@400;500;600&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:95.8%;ascent-override:94%;descent-override:36.5%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:82.4%;ascent-override:109.3%;descent-override:42.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.replace('no-js','js');</script>
<script src="site.js" defer></script>
</head>
<body class="page-story" data-optional="our_story" data-pending="This link will be added soon.">
<main class="story-page">
  <header class="page-heading" data-scene="story-head">
    <p class="eyebrow" data-copy="story_kicker" data-step="kicker">Moments we hold dear</p>
    <h1 data-copy="story_title" data-step="title">Our Story</h1>
    <span class="divider" aria-hidden="true" data-step="title" data-i="1"></span>
    <p class="body-text intro" data-if="story.intro" data-step="intro"><span data-field="story.intro"></span> <span class="nowrap" data-field="date"></span>.</p>
  </header>
  <section class="moments" aria-label="Photographs" data-copy-attr="aria-label:album_label">
    <figure class="moment m-left" data-scene="story-moment">
      <span class="frame story-frame mosaic" data-step="frame">
        <span class="photo-slot" data-slot="story_1">
          <img data-photo="story_1" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.0.caption}" sizes="min(68vw, 320px)" fetchpriority="high">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">01</span> <span class="cap" data-field="story.items.0.caption"></span></figcaption>
    </figure>
    <figure class="moment m-right" data-scene="story-moment">
      <span class="frame story-frame mosaic" data-step="frame">
        <span class="photo-slot" data-slot="story_2">
          <img data-photo="story_2" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.1.caption}" sizes="min(68vw, 320px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">02</span> <span class="cap" data-field="story.items.1.caption"></span></figcaption>
    </figure>
    <figure class="moment m-left" data-scene="story-moment">
      <span class="frame story-frame mosaic" data-step="frame">
        <span class="photo-slot" data-slot="story_3">
          <img data-photo="story_3" src="img/ph_story-640.webp" alt="" data-attr-alt="{story.items.2.caption}" sizes="min(68vw, 320px)" loading="lazy">
          <span class="ph-mark" aria-hidden="true"><span>Your photo here</span></span>
        </span>
        <span class="cut" aria-hidden="true"></span>
      </span>
      <figcaption data-step="caption"><span class="num" aria-hidden="true">03</span> <span class="cap" data-field="story.items.2.caption"></span></figcaption>
    </figure>
  </section>
  <footer class="signature" data-scene="story-next">
    <span class="divider" aria-hidden="true" data-step="names"></span>
    <p class="sig-names" data-field="name_display" data-step="names" data-i="1"></p>
    <p data-step="links" data-if="!thank_you_hides_details"><a class="btn btn-ghost" href="details.html"><span data-copy="day_title">The Day</span> <span aria-hidden="true">→</span></a></p>
    <p data-step="links" data-if="thank_you_hides_details"><a class="btn btn-ghost" href="home.html"><span data-copy="home_link">Home</span></a></p>
  </footer>
</main>
<nav class="site-nav" aria-label="Wedding pages">
  <ul>
    <li><a href="home.html"><span data-copy="nav_home">Home</span></a></li>
    <li data-optional="our_story"><a href="story.html" aria-current="page"><span data-copy="nav_story">Story</span></a></li>
    <li data-if="!thank_you_hides_details"><a href="details.html"><span data-if="!thank_you_on" data-copy="nav_details">Details</span><span data-if="thank_you_on" data-copy="nav_day">The Day</span></a></li>
    <li data-if="!rsvp.method !thank_you_on"><a href="rsvp.html"><span data-copy="nav_rsvp">RSVP</span></a></li>
  </ul>
</nav>
</body>
</html>
