<!doctype html>
<!-- Azulejo Mosaic · page 1 — the tile wall (/<slug>). On the cobalt wall: "You are invited", the names in Arizonia,
     the date and the city, and a panel of blue-and-white azulejo tiles (4 × 6: corner, border and field tiles turned
     as a tiler lays them), "Tap to open". Opening (docs/24 row 30, site.js MOTION.envelope): a tap presses the panel
     and a soft glaze light runs over it; then the tiles turn over ONE BY ONE in 3D — a wave that starts at the tile
     the guest touched and spreads across the panel; each tile shows its terracotta back as it turns and lifts away —
     and the card that was behind the tiles (portrait, "Our wedding", names, date) lifts, comes forward and flies to
     home (view transition invite-card → the home card). Every tile and the card are separate layers; the tiles are
     GPT painted tiles (interim: tiles cut from 05's painted border, build_images.py). Personal text: none —
     [data-field] / [data-text] / [data-photo] are filled on the server. Thank-you mode (G075): the same opening; the
     card carries the thank-you title and the date, its window the thank-you photo or — without one — a tile.
     Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102554">
<title data-text="{name_display} · {copy.envelope_kicker}">Azulejo Mosaic</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arizonia&family=Cormorant+Upright:wght@400;500;600&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:95.8%;ascent-override:94%;descent-override:36.5%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:82.4%;ascent-override:109.3%;descent-override:42.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="panel">
      <!-- the card behind the tiles (card paper: GPT texture toned by build_images.py until W2.8 card_paper) -->
      <div class="card" aria-hidden="true">
        <div class="card-photo photo-slot" data-slot="hero_portrait">
          <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_portrait-640.webp" sizes="min(30vw, 200px)" alt="">
          <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
          <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_portrait-640.webp" sizes="min(30vw, 200px)" alt="">
          <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/tile_1-256.webp" alt=""></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the tiles over it: 4 columns × 6 rows, row by row (k1–k4 = azulejo_1–4: field, border, corner, second field;
           q0–q3 = quarter turns, the same rule as build_images.tile_kind). Each tile has its painted front and its
           terracotta back; site.js gives each its turn in the wave (--d). -->
      <div class="wall" aria-hidden="true">
        <i class="tile k3 q0"><b class="front"></b><b class="back"></b></i><i class="tile k2 q0"><b class="front"></b><b class="back"></b></i><i class="tile k2 q0"><b class="front"></b><b class="back"></b></i><i class="tile k3 q1"><b class="front"></b><b class="back"></b></i>
        <i class="tile k2 q3"><b class="front"></b><b class="back"></b></i><i class="tile k4 q3"><b class="front"></b><b class="back"></b></i><i class="tile k1 q2"><b class="front"></b><b class="back"></b></i><i class="tile k2 q1"><b class="front"></b><b class="back"></b></i>
        <i class="tile k2 q3"><b class="front"></b><b class="back"></b></i><i class="tile k1 q1"><b class="front"></b><b class="back"></b></i><i class="tile k4 q0"><b class="front"></b><b class="back"></b></i><i class="tile k2 q1"><b class="front"></b><b class="back"></b></i>
        <i class="tile k2 q3"><b class="front"></b><b class="back"></b></i><i class="tile k4 q3"><b class="front"></b><b class="back"></b></i><i class="tile k1 q2"><b class="front"></b><b class="back"></b></i><i class="tile k2 q1"><b class="front"></b><b class="back"></b></i>
        <i class="tile k2 q3"><b class="front"></b><b class="back"></b></i><i class="tile k1 q1"><b class="front"></b><b class="back"></b></i><i class="tile k4 q0"><b class="front"></b><b class="back"></b></i><i class="tile k2 q1"><b class="front"></b><b class="back"></b></i>
        <i class="tile k3 q3"><b class="front"></b><b class="back"></b></i><i class="tile k2 q2"><b class="front"></b><b class="back"></b></i><i class="tile k2 q2"><b class="front"></b><b class="back"></b></i><i class="tile k3 q2"><b class="front"></b><b class="back"></b></i>
      </div>
      <!-- a soft glaze light passing over the tiles (light only, docs/11 §5.7) -->
      <span class="sheen"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- terracotta pots at the foot of the wall: GPT W2.10 only (parts.css); empty until they exist, never a stand-in -->
  <span class="pot pot-l" aria-hidden="true"></span>
  <span class="pot pot-r" aria-hidden="true"></span>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the invitation</span></a></p>
</main>
</body>
</html>
