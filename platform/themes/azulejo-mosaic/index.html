<!doctype html>
<!-- Azulejo Mosaic · page 1 — the closed envelope (/<slug>). Redesign of 2026-10-22 (docs/35 row 30, G430). On sunlit
     lime-whitewash plaster, an olive-and-jasmine spray in the top-left corner, "Together with their families" and the
     names in Arizonia; below them a portrait envelope of glaze-white paper whose stepped flap is a grid of hand-painted
     cobalt azulejo tiles, tied in a cross with natural jute twine and closed by one loose swallow tile at the flap's
     lowest step; under it the date · the city and "Tap to open"; a small panel of four tiles in each lower corner.
     Opening (site.js MOTION.envelope): on tap the knot loosens, the twine's vertical strand slides down and its two arms
     slip off to the sides, the swallow tile turns over on its vertical axis (its terracotta bisque back) and drops away,
     the stepped flap swings up on its top edge onto its terracotta-and-cobalt lining, the four-tile panels in the corners
     turn over in a wave, olive leaves and jasmine drift down, the glaze-white card rises from behind the pocket, comes
     forward and flies to home (view transition invite-card → the home hero card). Back, card, pocket, flap (outside +
     lining), the tile (front + back) and the three pieces of the twine are separate layers, all GPT pixels cut by
     build_images.py. Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server.
     Thank-you mode (G075): the same opening; the card carries the thank-you title and the date, its niche the thank-you
     photo or — without one — a painted tile. Design texts: data-copy (G068, theme.json "copy"). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ede3">
<title data-text="{name_display} · {copy.envelope_kicker}">Azulejo Mosaic</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {name_display} · {date|date-long} · {venue.city_region}" content="A wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.envelope_kicker} · {date|date-long} · {venue.city_region}" content="You are invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arizonia&family=Cormorant+Upright:wght@400;500;600&display=swap">
<style>/* names fallback: scripts/font-fallback.ts */
@font-face{font-family:fb1;src:local(Times New Roman),local(Liberation Serif),local(Tinos);size-adjust:95.8%;ascent-override:94%;descent-override:36.5%;line-gap-override:0%}
@font-face{font-family:fb2;src:local(Noto Serif),local(Droid Serif);size-adjust:82.4%;ascent-override:109.3%;descent-override:42.5%;line-gap-override:0%}</style>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-opening" data-pending="This link will be added soon.">
<a class="textlink skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>
<main class="opening">
  <span class="cover-spray" aria-hidden="true"></span>
  <div class="opening-heading">
    <p class="eyebrow" data-if="!thank_you_on" data-copy="envelope_kicker">Together with their families</p>
    <p class="eyebrow" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="names" data-fit><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </div>
  <div class="stage" role="button" tabindex="0" aria-label="Open the envelope" data-copy-attr="aria-label:envelope_open">
    <div class="envelope">
      <!-- the back with its terracotta lining, then the card in the pocket -->
      <span class="back"></span>
      <div class="card" aria-hidden="true">
        <div class="card-photo frame niche">
          <div class="photo-slot" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_niche-640.webp" sizes="min(24vw, 110px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on"><span>Your photo here</span></span>
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_niche-640.webp" sizes="min(24vw, 110px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo"><img src="img/tile_a-240.webp" alt=""></span>
          </div>
          <span class="cut"></span>
        </div>
        <p class="eyebrow card-line" data-if="!thank_you_on" data-copy="card_line">Our wedding</p>
        <p class="card-names" data-if="!thank_you_on" data-field="name_display"></p>
        <p class="card-names ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
        <p class="eyebrow card-date" data-field="date"></p>
      </div>
      <!-- the front pocket, the stepped tile flap (outside / terracotta lining) hinged on the top edge, the loose swallow
           tile (front / terracotta back) and the crossed twine in three pieces (strand with the knot, left arm, right arm) -->
      <span class="front"></span>
      <span class="flap"><span class="flap-out"></span><span class="flap-in"></span></span>
      <span class="tile"><span class="tile-spin"><span class="tile-face tile-f"></span><span class="tile-face tile-b"></span></span></span>
      <span class="twine tw-l"></span>
      <span class="twine tw-r"></span>
      <span class="twine tw-v"></span>
    </div>
  </div>
  <div class="opening-actions">
    <p class="opening-date eyebrow"><span data-field="date"></span><span aria-hidden="true"> · </span><span data-field="venue.city"></span></p>
    <p class="eyebrow tap-hint" aria-hidden="true"><span data-copy="envelope_hint_tap">Tap to open</span></p>
    <a class="btn enter" href="home.html" data-enter><span data-copy="envelope_enter">Enter</span></a>
    <button class="textlink replay" type="button"><span data-copy="envelope_replay">Replay the opening</span></button>
  </div>
  <!-- the four-tile panels in the lower corners: one medallion each; they turn over in a wave as the flap opens -->
  <div class="wave wave-l" aria-hidden="true"><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span></div>
  <div class="wave wave-r" aria-hidden="true"><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span><span class="wt"><i></i><i></i></span></div>
  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html"><span data-copy="envelope_open">Open the envelope</span></a></p>
</main>
</body>
</html>
