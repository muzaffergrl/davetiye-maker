<!doctype html>
<!-- Olive & Ivory · page 1 — envelope landing (/<slug>). W1.1 comp: "YOU ARE INVITED", the names in calligraphy, the olive
     cotton-paper envelope with the ivory-lace V flap and the oval botanical seal (+ tucked olive sprig) on its tip,
     "TAP TO OPEN". Opening (catalogue, docs/11 §7.3): on tap the lace-edged flap peels up on its hinge carrying the seal and
     its sprig with it (one .env-cflap-wrap, one rotateX), the open flap takes over at 90°, the ivory card glides up out of
     the pocket while two olive leaves float across the screen, comes forward and flies to home (view transition).
     Personal text: none — [data-field] / [data-text] / [data-photo] are filled on the server (platform/README.md).
     Thank-you mode (G075, data-if="thank_you_on"): the same envelope and opening; the card carries the couple's thank-you
     title and the date, its window the thank-you photo or — without one — the paper and the botanical seal (never a
     photo placeholder).
     Visuals: GPT parts only (img/, build_images.py). -->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-text="{name_display} · {date}">Wedding invitation</title>
<meta name="description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {name_display} · {date|date-long} · {venue.city_region}" content="Wedding invitation">
<meta name="description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {name_display} · {date|date-long}" content="Thank you">
<meta property="og:type" content="website">
<meta property="og:title" data-attr-content="{name_display} · {date}" content="Wedding invitation">
<meta property="og:description" data-if="!thank_you_on" data-attr-content="{copy.share_invited} · {date|date-long} · {venue.city_region}" content="You're invited">
<meta property="og:description" data-if="thank_you_on" data-attr-content="{thank_you_title} · {date|date-long}" content="Thank you">
<meta name="theme-color" content="#EDE4D0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Great+Vibes&amp;display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="thank-you.css" data-if="thank_you_on">
<script>/* early state — same keys as MOTION.storage in site.js (per site: suffixed with the slug from #site-data) */
(function(r){r.classList.replace('no-js','js');try{var d=document.getElementById('site-data'),k=d?':'+JSON.parse(d.textContent).slug:'';if(sessionStorage.getItem('invite:opened'+k)&&!/[?&]replay=1(&|$)/.test(location.search))r.classList.add('is-opened');}catch(e){}})(document.documentElement);
</script>
<!-- prefetch the home page: the rule points at the "Enter" link, whose href the platform has already set to /<slug>/home -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"selector_matches":"a[data-enter]"},"eagerness":"immediate"}]}</script>
<script src="site.js" defer></script>
</head>
<body class="page-envelope" data-pending="This link will be added soon.">

<!-- backdrop (W1.1): sunlit paper + the two GPT garden-rose clusters as separate layers, each wholly on screen (phones: the
     sunlit flower-free part of bg_page; landscape screens: the soft-focus page) -->
<div class="scene-bg" aria-hidden="true">
  <picture>
    <source media="(min-aspect-ratio: 3/4)" srcset="img/mist-640.webp">
    <img class="scene-img" src="img/bg_page-640.webp" srcset="img/bg_page-640.webp 640w, img/bg_page-1024.webp 1024w" sizes="236vw" alt="" fetchpriority="high">
  </picture>
  <img class="corner corner-tl" src="img/decor_tl-480.webp" srcset="img/decor_tl-480.webp 480w, img/decor_tl-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(34vw, 50vh, 520px), min(70vw, 34svh, 360px)" alt="" fetchpriority="high">
  <img class="corner corner-br" src="img/decor_br-480.webp" srcset="img/decor_br-480.webp 480w, img/decor_br-960.webp 960w" sizes="(min-aspect-ratio: 3/4) min(34vw, 50vh, 520px), min(74vw, 36svh, 380px)" alt="">
  <!-- the comp's loose accents resting on the paper (GPT accent parts: a silvery leaf, a ripe olive, a jasmine blossom) -->
  <img class="float f-leaf" src="img/accent_1-200.webp" alt="">
  <img class="float f-olive" src="img/accent_2-156.webp" alt="">
  <img class="float f-bloom" src="img/accent_3-200.webp" alt="">
</div>

<a class="skip" href="home.html" data-skip><span data-copy="envelope_skip">Skip</span></a>

<main class="env-page">
  <header class="env-head">
    <p class="kicker" data-if="!thank_you_on" data-copy="envelope_kicker">You are invited</p>
    <p class="kicker" data-if="thank_you_on" data-copy="ty_kicker">With love and thanks</p>
    <h1 class="script names"><span data-field="partners.0.display_name"></span> <span class="amp">&amp;</span> <span data-field="partners.1.display_name"></span></h1>
  </header>

  <div class="stage" role="button" tabindex="0" aria-label="Open the invitation" data-copy-attr="aria-label:envelope_open">
    <div class="env">
      <img class="env-flap" src="img/env_flap-440.webp" srcset="img/env_flap-440.webp 440w, img/env_flap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img class="env-body" src="img/env_body-440.webp" srcset="img/env_body-440.webp 440w, img/env_body-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <div class="card-slot">
        <div class="card" aria-hidden="true">
          <div class="photo-slot mask-card" data-slot="hero_portrait">
            <img data-if="!thank_you_on" data-photo="hero_portrait" src="img/ph_hero_portrait-320.webp" srcset="img/ph_hero_portrait-320.webp 320w, img/ph_hero_portrait-640.webp 640w" sizes="min(39vw, 205px)" alt="">
            <span class="ph-mark" data-if="!thank_you_on" aria-hidden="true"><img src="img/accent_3-200.webp" alt=""><span>Your photo here</span></span>
            <!-- thank-you mode: the couple's thank-you photo in the same window, else the paper and the seal (decoration) -->
            <img class="ty-photo" data-if="thank_you_on thank_you.photo" data-field="thank_you.photo" src="img/ph_hero_portrait-320.webp" sizes="min(39vw, 205px)" alt="">
            <span class="ty-decor" data-if="thank_you_on !thank_you.photo" aria-hidden="true"><span class="ty-seal"><img src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-640.webp 640w" sizes="min(30vw, 160px)" alt=""><span class="seal-mono" data-field="initials"></span></span></span>
          </div>
          <img class="card-img" src="img/card_small-320.webp" srcset="img/card_small-320.webp 320w, img/card_small-640.webp 640w" sizes="min(49vw, 256px)" alt="">
          <div class="card-copy">
            <p class="script" data-if="!thank_you_on" data-copy="card_line">We're getting married</p>
            <p class="ty-title" data-if="thank_you_on" data-field="thank_you_title"></p>
            <p class="kicker" data-field="date"></p>
            <p class="kicker" data-if="!thank_you_on" data-field="venue.city_region"></p>
          </div>
        </div>
      </div>
      <img class="env-pocket" src="img/env_pocket-440.webp" srcset="img/env_pocket-440.webp 440w, img/env_pocket-880.webp 880w" sizes="min(84vw, 440px)" alt="">
      <img class="env-closed" src="img/env_closed-440.webp" srcset="img/env_closed-440.webp 440w, img/env_closed-880.webp 880w" sizes="min(84vw, 440px)" alt="" fetchpriority="high">
      <!-- the flap and the seal (with its tucked sprig) share one hinge and one rotation: the seal is carried by the flap -->
      <div class="env-cflap-wrap">
        <img class="env-cflap" src="img/env_cflap-440.webp" srcset="img/env_cflap-440.webp 440w, img/env_cflap-880.webp 880w" sizes="min(84vw, 440px)" alt="">
        <div class="closure">
          <img src="img/closure-320.webp" srcset="img/closure-320.webp 320w, img/closure-640.webp 640w" sizes="min(41vw, 215px)" alt="">
          <span class="seal-mono" data-field="initials"></span>
        </div>
      </div>
    </div>
  </div>

  <p class="env-hint" aria-hidden="true"><span class="tap" data-copy="envelope_hint_tap">Tap to open</span><span class="click" data-copy="envelope_hint_click">Click to open</span></p>

  <div class="env-after">
    <a class="btn" href="home.html" data-enter data-copy="envelope_enter">Enter</a>
    <button class="replay textlink" type="button" data-copy="envelope_replay">Replay the opening</button>
  </div>

  <!-- without JavaScript (no <noscript>: its content is raw text, the platform could not rewrite the link) -->
  <p class="nojs-only"><a class="btn" href="home.html" data-copy="envelope_open">Open the invitation</a></p>
</main>

</body>
</html>
